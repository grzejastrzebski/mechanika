<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MECHANIKA — kalkulatory akademickie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbfaf5; --paper2:#f3f1e8; --card:#ffffff; --grid:#dde7ef;
    --line:#c9d6e3; --line2:#b3c2d2;
    --ink:#16243a; --soft:#3a4a60; --muted:#5a6b80;
    --blue:#1f3a93; --blue-d:#16275f; --red:#b6312a; --green:#27632a;
    --gold:#a9772b; --gold-d:#8a5f1f;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:"IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:var(--serif); color:var(--ink); background:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:22px 22px;
    display:flex; flex-direction:column; min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ---------- HEADER ---------- */
  header.top{
    display:flex; align-items:center; gap:18px;
    padding:14px 22px; border-bottom:2px solid var(--ink);
    background:rgba(251,250,245,.85);
    backdrop-filter:blur(8px);
  }
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none}
  .brand .mark{
    width:34px;height:34px;flex:0 0 34px;border:1px solid var(--line2);
    border-radius:8px;display:grid;place-items:center;background:#fff;
    box-shadow:0 1px 0 rgba(22,36,58,.04);
  }
  .brand .word{line-height:1}
  .brand .word b{
    font-family:var(--mono); font-weight:700; font-size:1.18rem; letter-spacing:.22em;
    color:var(--ink); display:block;
  }
  .brand .word span{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.32em; text-transform:uppercase;
    color:var(--muted); display:block; margin-top:3px;
  }
  .spacer{flex:1}
  .support{
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    font-family:var(--mono); font-size:.74rem; letter-spacing:.06em; font-weight:600;
    color:#fff; background:linear-gradient(180deg,var(--gold),var(--gold-d));
    border:0; border-radius:9px; padding:9px 15px; text-decoration:none;
    box-shadow:0 2px 0 #6f4d18; transition:transform .1s ease, box-shadow .1s ease;
  }
  .support:hover{transform:translateY(-1px); box-shadow:0 3px 0 #6f4d18}
  .support:active{transform:translateY(1px); box-shadow:0 0 0 #6f4d18}

  /* ---------- TABS ---------- */
  nav.tabs{
    display:flex; gap:2px; padding:0 14px; border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.5); overflow-x:auto; scrollbar-width:thin;
  }
  nav.tabs::-webkit-scrollbar{height:6px}
  nav.tabs::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
  .tab{
    appearance:none; background:none; border:0; cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:8px; padding:13px 15px 12px;
    color:var(--muted); font-family:var(--mono); font-size:.82rem; letter-spacing:.02em;
    border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s ease;
  }
  .tab .idx{font-size:.62rem; color:var(--muted); font-weight:600}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--blue); border-bottom-color:var(--blue)}
  .tab.active .idx{color:var(--blue)}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
  .tab.ready .dot{background:var(--green)}
  .tab.soon .dot{background:var(--gold); opacity:.6}

  /* ---------- STAGE ---------- */
  main{flex:1; position:relative; min-height:0; padding:14px}
  .stage{position:absolute; inset:14px; display:flex}
  .view{display:none; width:100%; height:100%}
  .view.show{display:flex}
  .frame{
    width:100%; height:100%; border:1px solid var(--line); border-radius:12px;
    background:#fff; overflow:hidden; box-shadow:0 6px 20px rgba(22,36,58,.08);
    position:relative;
  }
  .frame iframe{width:100%; height:100%; border:0; display:block; background:#fff}
  .frame .badge{
    position:absolute; top:10px; left:12px; z-index:2; pointer-events:none;
    font-family:var(--mono); font-size:.6rem; letter-spacing:.18em; text-transform:uppercase;
    color:var(--blue); background:rgba(255,255,255,.75); border:1px solid var(--line);
    padding:3px 8px; border-radius:6px; backdrop-filter:blur(4px);
  }

  /* ---------- SOON CARD ---------- */
  .soonwrap{width:100%; height:100%; display:grid; place-items:center;
    border:1px dashed var(--line2); border-radius:12px;
    background:repeating-linear-gradient(45deg, rgba(22,36,58,.02) 0 12px, transparent 12px 24px);
  }
  .soon{max-width:520px; text-align:center; padding:32px}
  .soon .tag{
    display:inline-block; font-family:var(--mono); font-size:.6rem; letter-spacing:.28em;
    text-transform:uppercase; color:var(--gold); border:1px solid rgba(169,119,43,.4);
    background:rgba(169,119,43,.08); padding:5px 11px; border-radius:20px; margin-bottom:18px;
  }
  .soon h2{font-family:var(--mono); font-weight:600; font-size:1.7rem; margin:0 0 10px; color:var(--ink); letter-spacing:.02em}
  .soon p{color:var(--soft); font-size:.96rem; line-height:1.65; margin:0 auto; max-width:440px}
  .soon .glyph{
    width:64px;height:64px;margin:0 auto 22px;border:1px solid var(--line2);border-radius:14px;
    display:grid;place-items:center;background:#fff;color:var(--muted);
  }

  /* ---------- HOME ---------- */
  .home{width:100%; height:100%; overflow:auto; border:1px solid var(--line); border-radius:12px;
    background:rgba(255,255,255,.45); padding:38px clamp(20px,5vw,56px)}
  .hero{max-width:780px; margin:8px 0 34px}
  .hero .kicker{font-family:var(--mono); font-size:.66rem; letter-spacing:.34em; text-transform:uppercase; color:var(--blue); margin-bottom:14px}
  .hero h1{font-family:var(--mono); font-weight:700; font-size:clamp(2rem,5vw,3.1rem); line-height:1.04; margin:0 0 16px; letter-spacing:.01em; color:var(--ink)}
  .hero h1 em{color:var(--blue); font-style:normal}
  .hero p{color:var(--soft); font-size:1.04rem; line-height:1.7; max-width:640px; margin:0}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); gap:14px; max-width:1100px}
  .card{
    text-align:left; cursor:pointer; appearance:none; color:inherit;
    border:1px solid var(--line); border-radius:12px; padding:18px 18px 16px;
    background:var(--card);
    transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease;
    opacity:0; transform:translateY(10px); animation:rise .5s ease forwards;
    display:flex; flex-direction:column; min-height:150px;
    box-shadow:0 1px 0 rgba(22,36,58,.03);
  }
  @keyframes rise{to{opacity:1; transform:translateY(0)}}
  .card:hover{transform:translateY(-3px); border-color:var(--blue); box-shadow:0 10px 26px rgba(22,36,58,.12)}
  .card .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .card .num{font-family:var(--mono); font-size:.7rem; color:var(--muted); letter-spacing:.1em}
  .card .st{font-family:var(--mono); font-size:.56rem; letter-spacing:.16em; text-transform:uppercase; padding:3px 8px; border-radius:20px}
  .card .st.r{color:var(--green); background:rgba(39,99,42,.08); border:1px solid rgba(39,99,42,.3)}
  .card .st.s{color:var(--gold); background:rgba(169,119,43,.08); border:1px solid rgba(169,119,43,.3)}
  .card h3{font-family:var(--mono); font-weight:600; font-size:1.08rem; margin:0 0 7px; color:var(--ink)}
  .card p{color:var(--soft); font-size:.84rem; line-height:1.55; margin:0; flex:1}
  .card .go{margin-top:12px; font-family:var(--mono); font-size:.72rem; color:var(--blue); display:flex; align-items:center; gap:6px}

  /* ---------- FOOTER ---------- */
  footer{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:11px 22px; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:.68rem; letter-spacing:.04em; color:var(--muted);
    background:rgba(255,255,255,.5);
  }
  footer a{color:var(--soft); text-decoration:none; border-bottom:1px dotted var(--line2)}
  footer a:hover{color:var(--blue)}

  /* ---------- DONATION MODAL ---------- */
  .overlay{
    position:fixed; inset:0; z-index:60; display:none; place-items:center; padding:20px;
    background:rgba(22,36,58,.35); backdrop-filter:blur(5px); animation:fade .25s ease}
  .overlay.show{display:grid}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    width:min(440px,100%); border:1px solid var(--line); border-radius:16px; overflow:hidden;
    background:#fff;
    box-shadow:0 20px 60px rgba(22,36,58,.25); animation:pop .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{transform:translateY(14px) scale(.97); opacity:0}to{transform:none; opacity:1}}
  .modal .head{padding:22px 24px 0; display:flex; gap:14px; align-items:flex-start}
  .modal .ico{width:42px;height:42px;flex:0 0 42px;border-radius:11px;display:grid;place-items:center;
    background:rgba(169,119,43,.12); border:1px solid rgba(169,119,43,.3); color:var(--gold)}
  .modal h3{font-family:var(--mono); font-weight:600; font-size:1.12rem; margin:2px 0 0; color:var(--ink)}
  .modal .body{padding:14px 24px 4px}
  .modal .body p{color:var(--soft); font-size:.92rem; line-height:1.65; margin:0}
  .modal .acts{padding:18px 24px 22px; display:flex; flex-direction:column; gap:9px}
  .btn-primary{
    width:100%; text-align:center; cursor:pointer; text-decoration:none; border:0;
    font-family:var(--mono); font-weight:600; font-size:.82rem; letter-spacing:.04em;
    color:#fff; background:linear-gradient(180deg,var(--gold),var(--gold-d)); padding:12px; border-radius:10px;
    box-shadow:0 2px 0 #6f4d18; transition:transform .1s ease, box-shadow .1s ease}
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 3px 0 #6f4d18}
  .btn-primary:active{transform:translateY(1px); box-shadow:0 0 0 #6f4d18}
  .btn-row{display:flex; gap:9px}
  .btn-ghost{
    flex:1; cursor:pointer; font-family:var(--mono); font-size:.74rem; letter-spacing:.02em;
    color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px}
  .btn-ghost:hover{color:var(--ink); border-color:var(--blue)}

  @media (max-width:560px){
    header.top{padding:12px 14px; gap:10px}
    .brand .word b{font-size:1rem; letter-spacing:.18em}
    .support{padding:8px 11px; font-size:.68rem}
    main{padding:8px} .stage{inset:8px}
    .home{padding:24px 16px}
  }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#start" id="brandLink">
    <span class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f3a93" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18" stroke-width="1" opacity=".55"/><path d="M3 21 21 3" stroke="#a9772b" stroke-width="1.2"/>
      </svg>
    </span>
    <span class="word"><b id="brandName">MECHANIKA</b><span id="brandTag">kalkulatory akademickie</span></span>
  </a>
  <span class="spacer"></span>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <div class="stage" id="stage"></div>
</main>

<footer>
  <span id="footYear">© 2026 MECHANIKA</span>
  <span class="spacer" style="flex:1"></span>
  <span>narzędzia darmowe · liczone lokalnie w przeglądarce</span>
</footer>

<script>
/* ============================================================
   KONFIGURACJA  —  edytuj tutaj
   ============================================================ */
const BRAND = { name:"MECHANIKA", tagline:"kalkulatory akademickie" };

const TABS = [
  { id:"start",       label:"Start",          status:"home" },
  { id:"ruszty",      label:"Ruszty",         status:"ready", type:"iframe", src:"solver-rusztow.html",
    title:"Solver rusztów (MES)",
    desc:"Analiza rusztów płaskich metodą elementów skończonych: reakcje, siły wewnętrzne, wykresy Mz/Ms oraz graficzne mnożenie Wereszczagina." },
  { id:"plyty",       label:"Płyty okrągłe",  status:"ready", type:"iframe", src:"plyty-okragle.html",
    title:"Płyty okrągłe",
    desc:"Zginanie osiowo-symetrycznych płyt kołowych i pierścieniowych: ugięcia, momenty i siły poprzeczne, krok po kroku, z wykresami." },
  // Kolejne moduły (Belki, Ramy, Reakcje, Przesunięcia) dodajemy pojedynczo
  // później — patrz historia gita po gotowe wpisy „soon".
];

/* ============================================================
   APLIKACJA POWŁOKI
   ============================================================ */
const $ = id => document.getElementById(id);
const stage = $("stage");
const tabsEl = $("tabs");
const frames = {};       // id -> iframe element (lazy)
let active = null;

// brand + linki wpłat
document.title = BRAND.name + " — " + BRAND.tagline;
$("brandName").textContent = BRAND.name;
$("brandTag").textContent = BRAND.tagline;
$("footYear").textContent = "© " + new Date().getFullYear() + " " + BRAND.name;

// --- zakładki ---
TABS.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "tab " + (t.status==="ready" ? "ready" : t.status==="soon" ? "soon" : "");
  b.dataset.id = t.id;
  b.innerHTML =
    `<span class="idx">${String(i).padStart(2,"0")}</span>` +
    (t.status!=="home" ? `<span class="dot"></span>` : "") +
    `<span>${t.label}</span>`;
  b.addEventListener("click", () => go(t.id));
  tabsEl.appendChild(b);
});

function buildHome(){
  const wrap = document.createElement("div");
  wrap.className = "view home"; wrap.dataset.id = "start";
  const mods = TABS.filter(t => t.status!=="home");
  wrap.innerHTML = `
    <div class="hero">
      <div class="kicker">obliczenia konstrukcyjne · w przeglądarce · za darmo</div>
      <h1>Narzędzia do <em>statyki i wytrzymałości</em> w jednym miejscu.</h1>
      <p>Kalkulatory inżynierskie — solver rusztów płaskich (MES) oraz płyty okrągłe i pierścieniowe. Wszystko liczy się lokalnie w Twojej przeglądarce, bez logowania i bez wysyłania danych. Kolejne moduły w przygotowaniu. Wybierz kalkulator poniżej lub z zakładek u góry.</p>
    </div>
    <div class="grid">
      ${mods.map((m,k)=>`
        <button class="card" data-go="${m.id}" style="animation-delay:${k*55}ms">
          <div class="top">
            <span class="num">// ${String(TABS.indexOf(m)).padStart(2,"0")}</span>
            <span class="st ${m.status==="ready"?"r":"s"}">${m.status==="ready"?"Gotowe":"Wkrótce"}</span>
          </div>
          <h3>${m.title}</h3>
          <p>${m.desc}</p>
          <span class="go">${m.status==="ready"?"Otwórz":"W przygotowaniu"} <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>`).join("")}
    </div>`;
  wrap.querySelectorAll("[data-go]").forEach(c => c.addEventListener("click", ()=>go(c.dataset.go)));
  return wrap;
}

function buildSoon(t){
  const wrap = document.createElement("div");
  wrap.className = "view"; wrap.dataset.id = t.id;
  wrap.innerHTML = `
    <div class="soonwrap"><div class="soon">
      <div class="glyph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"/></svg></div>
      <div class="tag">moduł w przygotowaniu</div>
      <h2>${t.title}</h2>
      <p>${t.desc}</p>
    </div></div>`;
  return wrap;
}

function ensureFrame(t){
  let f = frames[t.id];
  if(!f){
    const wrap = document.createElement("div");
    wrap.className = "view"; wrap.dataset.id = t.id;
    wrap.innerHTML = `<div class="frame"><span class="badge">${t.label}</span><iframe loading="lazy" title="${t.title}"></iframe></div>`;
    stage.appendChild(wrap);
    const iframe = wrap.querySelector("iframe");
    iframe.src = t.src;                 // ładowane dopiero przy pierwszym wejściu
    frames[t.id] = wrap;
    f = wrap;
  }
  return f;
}

function go(id){
  const t = TABS.find(x => x.id === id) || TABS[0];
  active = t.id;
  // zakładki
  tabsEl.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.id === t.id));
  // hash
  if(location.hash.slice(1) !== t.id) history.replaceState(null, "", "#"+t.id);
  // treść — ukryj wszystkie
  stage.querySelectorAll(".view").forEach(v => v.classList.remove("show"));
  let view;
  if(t.status === "home"){
    view = stage.querySelector('.view.home') || stage.appendChild(buildHome());
  } else if(t.type === "iframe"){
    view = ensureFrame(t);
  } else {
    view = stage.querySelector(`.view[data-id="${t.id}"]:not(.frame)`) ;
    if(!view || view.querySelector("iframe")){ view = stage.appendChild(buildSoon(t)); }
  }
  view.classList.add("show");
}

window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if(id && id !== active) go(id);
});

// start: z hasha albo „start"
go(location.hash.slice(1) || "start");
</script>
</body>
</html>
