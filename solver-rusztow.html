                })}
              </div>
            </>
          )}
          {symbolic.enabled && <span className="text-[10px] text-slate-500 italic">Wpisuj L=1, P/q=1, EJ=1 — wartości będą bezpośrednio współczynnikami.</span>}
        </div>
      </div>

      <div className="max-w-7xl mx-auto px-6 py-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-slate-900/40 border border-slate-800 rounded-lg overflow-hidden no-print">
          <div className="border-b border-slate-800 px-3 py-2 bg-slate-900/60 flex items-center gap-2">
            <span className="text-[10px] uppercase tracking-wider text-slate-500">Stan:</span>
            <button onClick={()=>setActiveState(0)} className={`px-3 py-1 text-xs font-semibold rounded transition-colors ${activeState===0?'bg-cyan-500/20 text-cyan-300 ring-1 ring-cyan-500/40':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>Stan 0 (obciążenia rzeczywiste)</button>
            <button onClick={()=>setActiveState(1)} className={`px-3 py-1 text-xs font-semibold rounded transition-colors ${activeState===1?'bg-violet-500/20 text-violet-300 ring-1 ring-violet-500/40':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>Stan 1 (X₁=1)</button>
            <button onClick={()=>setActiveState(2)} className={`px-3 py-1 text-xs font-semibold rounded transition-colors ${activeState===2?'bg-pink-500/20 text-pink-300 ring-1 ring-pink-500/40':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>Stan 2 (X₂=1)</button>
            {staticInfo !== null && (
              <span className={`ml-auto text-[10px] font-mono px-2 py-0.5 rounded ring-1 ${staticInfo.n < 0 ? 'text-orange-300 ring-orange-700/50 bg-orange-950/30' : staticInfo.n === 0 ? 'text-emerald-400 ring-emerald-700/50 bg-emerald-950/30' : staticInfo.n <= 2 ? 'text-amber-300 ring-amber-700/50 bg-amber-950/30' : 'text-rose-400 ring-rose-700/50 bg-rose-950/30'}`}>n = {staticInfo.n}</span>
            )}
          </div>
          <div className="border-b border-slate-800 flex bg-slate-900/60 overflow-x-auto">
            <button className={tabBtn(activeTab==='nodes')} onClick={()=>setActiveTab('nodes')}>Węzły · {nodes.length}</button>
            <button className={tabBtn(activeTab==='elements')} onClick={()=>setActiveTab('elements')}>Pręty · {elements.length}</button>
            <button className={tabBtn(activeTab==='supports')} onClick={()=>setActiveTab('supports')}>Podpory · {supports.length}</button>
            <button className={tabBtn(activeTab==='loads')} onClick={()=>setActiveTab('loads')}>Obciążenia · {loads.length}</button>
          </div>
          <div className="p-4">
            {activeTab==='nodes' && <div>
              <table className="w-full text-sm"><thead className="text-[10px] uppercase text-slate-500 tracking-wider"><tr className="border-b border-slate-800"><th className="text-left py-2 font-medium">ID</th><th className="text-left py-2 font-medium">x</th><th className="text-left py-2 font-medium">y</th><th></th></tr></thead><tbody>
                {nodes.map((node,i) => <tr key={i} className="border-b border-slate-800/50 hover:bg-slate-900/40">
                  <td><input className={inputCell} value={node.id} onChange={e=>updateNode(i,'id',e.target.value)}/></td>
                  <td><input className={inputCell} type="number" step="0.1" value={node.x} onChange={e=>updateNode(i,'x',e.target.value)}/></td>
                  <td><input className={inputCell} type="number" step="0.1" value={node.y} onChange={e=>updateNode(i,'y',e.target.value)}/></td>
                  <td className="text-right"><button className={iconBtn} onClick={()=>removeNode(i)}><Trash2 size={14}/></button></td>
                </tr>)}
              </tbody></table>
              <button className={`${addBtn} mt-3`} onClick={addNode}><Plus size={12}/> Dodaj węzeł</button>
            </div>}
            {activeTab==='elements' && <div>
              <table className="w-full text-sm"><thead className="text-[10px] uppercase text-slate-500 tracking-wider"><tr className="border-b border-slate-800"><th className="text-left py-2 font-medium">ID</th><th className="text-left py-2 font-medium">Węzeł 1</th><th className="text-left py-2 font-medium">Węzeł 2</th><th className="text-left py-2 font-medium">EI</th><th className="text-left py-2 font-medium">GJ</th><th className="text-left py-2 font-medium" title="Obciążenie ciągłe (siła na metr). Ujemna = w dół.">q</th><th></th></tr></thead><tbody>
                {elements.map((el,i) => <tr key={i} className="border-b border-slate-800/50 hover:bg-slate-900/40">
                  <td className="font-mono text-xs px-2 text-slate-400">{el.id}</td>
                  <td><select className={inputCell} value={el.n1} onChange={e=>updateElement(i,'n1',e.target.value)}><option value="">—</option>{nodes.map(n=><option key={n.id} value={n.id}>{n.id}</option>)}</select></td>
                  <td><select className={inputCell} value={el.n2} onChange={e=>updateElement(i,'n2',e.target.value)}><option value="">—</option>{nodes.map(n=><option key={n.id} value={n.id}>{n.id}</option>)}</select></td>
                  <td><input className={inputCell} type="number" step="0.1" value={el.EI} onChange={e=>updateElement(i,'EI',e.target.value)}/></td>
                  <td><input className={inputCell} type="number" step="0.1" value={el.GJ} onChange={e=>updateElement(i,'GJ',e.target.value)}/></td>
                  <td><input className={inputCell} type="number" step="0.5" value={getQ(el.id)} onChange={e=>setQ(el.id, e.target.value)}/></td>
                  <td className="text-right"><button className={iconBtn} onClick={()=>removeElement(i)}><Trash2 size={14}/></button></td>
                </tr>)}
              </tbody></table>
              <button className={`${addBtn} mt-3`} onClick={addElement}><Plus size={12}/> Dodaj pręt</button>
            </div>}
            {activeTab==='supports' && <div>
              <table className="w-full text-sm"><thead className="text-[10px] uppercase text-slate-500 tracking-wider"><tr className="border-b border-slate-800"><th className="text-left py-2 font-medium">Węzeł</th><th className="text-center py-2 font-medium">w</th><th className="text-center py-2 font-medium">θx</th><th className="text-center py-2 font-medium">θy</th><th></th></tr></thead><tbody>
                {supports.map((sup,i) => <tr key={i} className="border-b border-slate-800/50 hover:bg-slate-900/40">
                  <td><select className={inputCell} value={sup.node} onChange={e=>updateSupport(i,'node',e.target.value)}><option value="">—</option>{nodes.map(n=><option key={n.id} value={n.id}>{n.id}</option>)}</select></td>
                  <td className="text-center"><input type="checkbox" className={checkCell} checked={!!sup.z} onChange={e=>updateSupport(i,'z',e.target.checked)}/></td>
                  <td className="text-center"><input type="checkbox" className={checkCell} checked={!!sup.rx} onChange={e=>updateSupport(i,'rx',e.target.checked)}/></td>
                  <td className="text-center"><input type="checkbox" className={checkCell} checked={!!sup.ry} onChange={e=>updateSupport(i,'ry',e.target.checked)}/></td>
                  <td className="text-right"><button className={iconBtn} onClick={()=>removeSupport(i)}><Trash2 size={14}/></button></td>
                </tr>)}
              </tbody></table>
              <button className={`${addBtn} mt-3`} onClick={addSupport}><Plus size={12}/> Dodaj podporę</button>
            </div>}
            {activeTab==='loads' && <div>
              <table className="w-full text-sm"><thead className="text-[10px] uppercase text-slate-500 tracking-wider"><tr className="border-b border-slate-800"><th className="text-left py-2 font-medium">Węzeł</th><th className="text-left py-2 font-medium">Fz</th><th className="text-left py-2 font-medium">Mx</th><th className="text-left py-2 font-medium">My</th><th></th></tr></thead><tbody>
                {loads.map((ld,i) => <tr key={i} className="border-b border-slate-800/50 hover:bg-slate-900/40">
                  <td><select className={inputCell} value={ld.node} onChange={e=>updateLoad(i,'node',e.target.value)}><option value="">—</option>{nodes.map(n=><option key={n.id} value={n.id}>{n.id}</option>)}</select></td>
                  <td><input className={inputCell} type="number" step="0.1" value={ld.Fz} onChange={e=>updateLoad(i,'Fz',e.target.value)}/></td>
                  <td><input className={inputCell} type="number" step="0.1" value={ld.Mx} onChange={e=>updateLoad(i,'Mx',e.target.value)}/></td>
                  <td><input className={inputCell} type="number" step="0.1" value={ld.My} onChange={e=>updateLoad(i,'My',e.target.value)}/></td>
                  <td className="text-right"><button className={iconBtn} onClick={()=>removeLoad(i)}><Trash2 size={14}/></button></td>
                </tr>)}
              </tbody></table>
              <button className={`${addBtn} mt-3`} onClick={addLoad}><Plus size={12}/> Dodaj obciążenie</button>
            </div>}
          </div>
        </div>

        <div className="bg-slate-900/40 border border-slate-800 rounded-lg overflow-hidden">
          <div className="border-b border-slate-800 flex items-center bg-slate-900/60 no-print flex-wrap">
            <button onClick={()=>setViewMode('structure')} className={`px-3 py-2.5 text-xs font-medium tracking-wide uppercase transition-colors flex items-center gap-1.5 border-b-2 ${viewMode==='structure'?'text-slate-200 border-slate-400':'text-slate-500 border-transparent hover:text-slate-300'}`}><Eye size={12}/> Schemat</button>
            <button onClick={()=>setViewMode('mz')} disabled={!results} className={`px-3 py-2.5 text-xs font-medium tracking-wide uppercase transition-colors flex items-center gap-1.5 border-b-2 ${viewMode==='mz'?'text-cyan-300 border-cyan-400':'text-slate-500 border-transparent hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed'}`}><BarChart3 size={12}/> Mz {activeState===0?'(St.0)':activeState===1?'(St.1)':'(St.2)'}</button>
            <button onClick={()=>setViewMode('ms')} disabled={!results} className={`px-3 py-2.5 text-xs font-medium tracking-wide uppercase transition-colors flex items-center gap-1.5 border-b-2 ${viewMode==='ms'?'text-orange-300 border-orange-400':'text-slate-500 border-transparent hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed'}`}><Activity size={12}/> Ms {activeState===0?'(St.0)':activeState===1?'(St.1)':'(St.2)'}</button>
            <div className="w-px h-6 bg-slate-800 mx-1"></div>
            <button onClick={()=>setViewMode('mz3d')} disabled={!results} className={`px-3 py-2.5 text-xs font-medium tracking-wide uppercase transition-colors flex items-center gap-1.5 border-b-2 ${viewMode==='mz3d'?'text-cyan-300 border-cyan-400':'text-slate-500 border-transparent hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed'}`}><BarChart3 size={12}/> Mz 3D</button>
            <button onClick={()=>setViewMode('ms3d')} disabled={!results} className={`px-3 py-2.5 text-xs font-medium tracking-wide uppercase transition-colors flex items-center gap-1.5 border-b-2 ${viewMode==='ms3d'?'text-orange-300 border-orange-400':'text-slate-500 border-transparent hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed'}`}><Activity size={12}/> Ms 3D</button>
            <div className="w-px h-6 bg-slate-800 mx-1"></div>
            <button onClick={()=>setViewMode('mzFinal')} disabled={!results || !results.finalForces} className={`px-3 py-2.5 text-xs font-medium tracking-wide uppercase transition-colors flex items-center gap-1.5 border-b-2 ${viewMode==='mzFinal'?'text-emerald-300 border-emerald-400':'text-slate-500 border-transparent hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed'}`} title="M = M₀ + X₁·M₁ (+ X₂·M₂)"><BarChart3 size={12}/> Mz końcowy</button>
            <div className="flex-1"></div>
            <button onClick={resetView} title="Reset zoom/pan/obrotu" className="text-[10px] uppercase tracking-wider text-slate-500 hover:text-cyan-300 px-3 py-1 rounded hover:bg-slate-800/60 mr-2">⟲ Reset widoku</button>
            {!results && <span className="text-[10px] text-slate-600 px-3">Naciśnij Oblicz</span>}
          </div>
          <div className="aspect-[19/13] bg-slate-950">
            <StructureView nodes={nodes} elements={elementsForView} supports={supports} loads={loads} results={displayResults} viewMode={viewMode==='mzFinal'?'mz':(viewMode==='msFinal'?'ms':viewMode)} view={view} setView={setView} momentSuffix={symSuffix('M', (viewMode==='mzFinal'||viewMode==='msFinal') ? 0 : activeState)}/>
          </div>
        </div>
      </div>

      {error && <div className="max-w-7xl mx-auto px-6 no-print"><div className="bg-rose-950/40 border border-rose-900 rounded-lg px-4 py-3 text-sm text-rose-200">{error}</div></div>}

      {results && <div className="max-w-7xl mx-auto px-6 pb-10 space-y-4">

        {/* Krok 1: schemat gotowy, stany do uzupełnienia */}
        {staticInfo !== null && staticInfo.n > 0 && !results.deltas && basicSystem.length > 0 && (
          <div className="bg-amber-950/20 border border-amber-800/50 rounded-lg p-4">
            <div className="flex items-center gap-3 flex-wrap mb-3">
              <span className="text-amber-300 font-bold text-sm">Krok 1 gotowy</span>
              <span className="text-slate-500 text-sm">— schemat zamodelowany. Uzupełnij stany i kliknij Oblicz ponownie.</span>
            </div>
            <div className="flex items-center gap-2 flex-wrap mb-3">
              <span className={`px-2 py-0.5 rounded font-mono font-bold text-sm ring-1 ${staticInfo.n <= 2 ? 'text-amber-300 bg-amber-950/50 ring-amber-700/50' : 'text-rose-300 bg-rose-950/50 ring-rose-700/50'}`}>n = {staticInfo.n}</span>
              <span className="text-slate-300 text-sm">Układ {staticInfo.n}× statycznie niewyznaczalny</span>
              <span className="text-xs font-mono text-slate-500">n = 3·{staticInfo.m} + {staticInfo.r} − 3·{staticInfo.w} = {staticInfo.n}</span>
              {staticInfo.n > 2 && <span className="text-rose-400 text-[11px]">⚠ Interface obsługuje do n = 2 — wpisane zostaną tylko X₁ i X₂</span>}
            </div>
            <div className="text-[10px] uppercase tracking-wider text-slate-500 mb-2">Krok 2 — zdefiniuj stany jednostkowe:</div>
            <div className="space-y-2 mb-3">
              {basicSystem.map((rel, i) => {
                const inIface = i < 2;
                return (
                  <div key={i} className={`flex items-start gap-3 p-2.5 rounded-lg border ${inIface ? i===0 ? 'bg-violet-950/25 border-violet-800/40' : 'bg-pink-950/25 border-pink-800/40' : 'bg-slate-900/30 border-slate-800/30 opacity-50'}`}>
                    <span className={`w-6 text-center py-px rounded font-bold text-[11px] ring-1 flex-shrink-0 mt-0.5 ${i===0?'text-violet-300 bg-violet-950/40 ring-violet-700/40':i===1?'text-pink-300 bg-pink-950/40 ring-pink-700/40':'text-slate-400 bg-slate-900/60 ring-slate-700/40'}`}>{rel.xi}</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-[10px] font-mono text-slate-500 mb-0.5">zwolnij {rel.constraint} w układzie podstawowym</div>
                      {inIface ? (
                        <div className={`text-sm font-semibold ${i===0?'text-violet-200':i===1?'text-pink-200':''}`}>
                          Przejdź do <span className="font-mono bg-slate-900/60 px-1 rounded">Stan {i+1}</span> → Obciążenia → dodaj: węzeł <span className="font-mono">{rel.node}</span>,&nbsp;
                          <span className="font-mono">{rel.dof==='ry'?'My = 1':rel.dof==='rx'?'Mx = 1':'Fz = 1'}</span>
                          , pozostałe = 0
                        </div>
                      ) : (
                        <div className="text-xs text-slate-500">Stan {i+1} — poza interfejsem (n &gt; 2)</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="flex items-center gap-3 flex-wrap pt-2 border-t border-amber-800/30">
              <button
                onClick={handleAutoFill}
                className="flex items-center gap-2 px-4 py-2 text-sm font-semibold rounded-lg bg-amber-500/20 text-amber-200 hover:bg-amber-500/30 ring-1 ring-amber-600/40 transition-colors"
              >
                ⚡ Zastosuj układ podstawowy i wpisz stany
              </button>
              <span className="text-[11px] text-slate-500">zwolni więzy w podporach + wpisze obciążenia jednostkowe — potem kliknij <span className="text-cyan-400 font-semibold">▶ Oblicz</span></span>
            </div>
          </div>
        )}

        {results.deltas && <div className="bg-emerald-950/30 border border-emerald-800/50 rounded-lg p-4">
          <div className="text-xs uppercase tracking-wider text-emerald-300 mb-3 font-semibold flex items-center gap-3 flex-wrap">
            <span>Wereszczagin · Metoda sił {results.deltas.has2 && <span className="text-[10px] normal-case tracking-normal text-emerald-400/70">(układ 2× niewyznaczalny)</span>}</span>
            <span className="bg-amber-950/40 border border-amber-700/40 rounded px-2 py-0.5 normal-case tracking-normal text-amber-200 font-mono text-xs">EJ/GC = {fmt(ejGcRatio, 2)}</span>
          </div>
          {results.deltas.has2 ? (
            <div className="space-y-3">
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-sm font-mono">
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₁₁</div><div className="text-emerald-300">{symFmt(results.deltas.delta11, 'd_self', 4, 1)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₁₂ = δ₂₁</div><div className="text-emerald-300">{symFmt(results.deltas.delta12, 'd_cross', 4, 1, 2)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₂₂</div><div className="text-emerald-300">{symFmt(results.deltas.delta22, 'd_self', 4, 2)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₁₀</div><div className="text-emerald-300">{symFmt(results.deltas.delta10, 'd_cross', 4, 1, 0)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₂₀</div><div className="text-emerald-300">{symFmt(results.deltas.delta20, 'd_cross', 4, 2, 0)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₀₀ (kontrola)</div><div className="text-slate-400">{fmt(results.deltas.delta00, 4)}</div></div>
              </div>
              <div className="grid grid-cols-2 gap-3 text-sm font-mono">
                <div className="bg-emerald-900/30 rounded px-3 py-2 ring-1 ring-emerald-700/40"><div className="text-[10px] text-emerald-400">X₁ (z układu 2×2)</div><div className="text-emerald-200 font-bold">{symFmt(results.deltas.X1, 'X', 4, 1)}</div></div>
                <div className="bg-emerald-900/30 rounded px-3 py-2 ring-1 ring-emerald-700/40"><div className="text-[10px] text-emerald-400">X₂ (z układu 2×2)</div><div className="text-emerald-200 font-bold">{symFmt(results.deltas.X2, 'X', 4, 2)}</div></div>
              </div>
              <div className="text-[11px] text-slate-400 font-mono pt-1">
                <div>[δ₁₁ δ₁₂; δ₁₂ δ₂₂]·[X₁; X₂] = −[δ₁₀; δ₂₀]</div>
                <div className="mt-1">Wykres końcowy: M = M₀ + X₁·M₁ + X₂·M₂ — kliknij "Mz końcowy"</div>
              </div>
            </div>
          ) : (
            <>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm font-mono">
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₁₁</div><div className="text-emerald-300">{symFmt(results.deltas.delta11, 'd_self', 4, 1)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₁₀</div><div className="text-emerald-300">{symFmt(results.deltas.delta10, 'd_cross', 4, 1, 0)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₀₀ (kontrola)</div><div className="text-slate-400">{fmt(results.deltas.delta00, 4)}</div></div>
                <div className="bg-emerald-900/30 rounded px-3 py-2 ring-1 ring-emerald-700/40"><div className="text-[10px] text-emerald-400">X₁ = −δ₁₀ / δ₁₁</div><div className="text-emerald-200 font-bold">{symFmt(results.deltas.X1, 'X', 4, 1)}</div></div>
              </div>
              <div className="mt-3 text-[11px] text-slate-400">Wykres końcowy: M = M₀ + X₁·M₁ — kliknij "Mz końcowy" w widoku</div>
            </>
          )}
          <div className="mt-3 flex flex-wrap items-center gap-2 no-print">
            <span className="text-[10px] uppercase tracking-wider text-slate-500">Rozkład Wereszczagina:</span>
            <button onClick={()=>setWereszczaginShow(wereszczaginShow==='11'?null:'11')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='11'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='11'?'▼':'▶'} δ₁₁</button>
            {results.deltas.has2 && <button onClick={()=>setWereszczaginShow(wereszczaginShow==='22'?null:'22')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='22'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='22'?'▼':'▶'} δ₂₂</button>}
            {results.deltas.has2 && <button onClick={()=>setWereszczaginShow(wereszczaginShow==='12'?null:'12')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='12'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='12'?'▼':'▶'} δ₁₂</button>}
            <button onClick={()=>setWereszczaginShow(wereszczaginShow==='10'?null:'10')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='10'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='10'?'▼':'▶'} δ₁₀</button>
            {results.deltas.has2 && <button onClick={()=>setWereszczaginShow(wereszczaginShow==='20'?null:'20')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='20'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='20'?'▼':'▶'} δ₂₀</button>}
            <button onClick={()=>setWereszczaginShow(wereszczaginShow==='00'?null:'00')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='00'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='00'?'▼':'▶'} δ₀₀</button>
          </div>
          {wereszczaginShow && <WereshchaginPanel deltas={results.deltas} pairKey={wereszczaginShow} label={`Rozkład per pręt: δ${wereszczaginShow.split('').map(c => c==='0'?'₀':c==='1'?'₁':'₂').join('')}`} sym={sym}/>}
        </div>}

        <div className="bg-slate-900/40 border border-slate-800 rounded-lg overflow-hidden">
          <div className="border-b border-slate-800 flex items-center bg-slate-900/60 no-print">
            <button className={tabBtn(resultsTab==='forces')} onClick={()=>setResultsTab('forces')}>Siły wewnętrzne</button>
            <button className={tabBtn(resultsTab==='reactions')} onClick={()=>setResultsTab('reactions')}>Reakcje</button>
            <button className={tabBtn(resultsTab==='displacements')} onClick={()=>setResultsTab('displacements')}>Przemieszczenia</button>
            <div className="flex-1"></div>
            <span className="text-[10px] uppercase tracking-wider text-slate-500 px-3">{activeState===0?'Stan 0':'Stan 1'}</span>
          </div>
          <div className="p-4 overflow-x-auto">
            {tableResults && resultsTab==='forces' && <table className="w-full text-sm font-mono"><thead className="text-[10px] uppercase text-slate-500 tracking-wider"><tr className="border-b border-slate-800"><th className="text-left py-2 px-2">Pręt</th><th className="text-left py-2 px-2">Węzeł</th><th className="text-right py-2 px-2">V</th><th className="text-right py-2 px-2">Ms</th><th className="text-right py-2 px-2">Mz</th></tr></thead><tbody>
              {tableResults.elementForces.map((ef,i) => <Fragment key={i}>
                <tr className="border-b border-slate-800/30 hover:bg-slate-900/40">
                  <td className="py-1.5 px-2 text-cyan-400" rowSpan="2">{ef.el.id}</td>
                  <td className="py-1.5 px-2 text-slate-400">{ef.el.n1} (start)</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.V1, 'V')}</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.Ms1, 'M')}</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.Mz1, 'M')}</td>
                </tr>
                <tr className="border-b border-slate-800 hover:bg-slate-900/40">
                  <td className="py-1.5 px-2 text-slate-400">{ef.el.n2} (koniec)</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.V2, 'V')}</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.Ms2, 'M')}</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.Mz2, 'M')}</td>
                </tr>
              </Fragment>)}
            </tbody></table>}
            {tableResults && resultsTab==='reactions' && <table className="w-full text-sm font-mono"><thead className="text-[10px] uppercase text-slate-500 tracking-wider"><tr className="border-b border-slate-800"><th className="text-left py-2 px-2">Węzeł</th><th className="text-right py-2 px-2">Rz</th><th className="text-right py-2 px-2">Mx</th><th className="text-right py-2 px-2">My</th></tr></thead><tbody>
              {tableResults.reactions.filter(r => r.Fz!==null||r.Mx!==null||r.My!==null).map((r,i) => <tr key={i} className="border-b border-slate-800/50 hover:bg-slate-900/40">
                <td className="py-1.5 px-2 text-cyan-400">{r.id}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(r.Fz, 'Rz')}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(r.Mx, 'Rm')}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(r.My, 'Rm')}</td>
              </tr>)}
            </tbody></table>}
            {tableResults && resultsTab==='displacements' && <table className="w-full text-sm font-mono"><thead className="text-[10px] uppercase text-slate-500 tracking-wider"><tr className="border-b border-slate-800"><th className="text-left py-2 px-2">Węzeł</th><th className="text-right py-2 px-2">w</th><th className="text-right py-2 px-2">θx</th><th className="text-right py-2 px-2">θy</th></tr></thead><tbody>
              {tableResults.displacements.map((d,i) => <tr key={i} className="border-b border-slate-800/50 hover:bg-slate-900/40">
                <td className="py-1.5 px-2 text-cyan-400">{d.id}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(d.w, 'w', 4)}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(d.thetaX, 'th', 4)}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(d.thetaY, 'th', 4)}</td>
              </tr>)}
            </tbody></table>}
            {!tableResults && <div className="text-sm text-slate-500 py-4">Stan {activeState} jest pusty (brak obciążeń ani q≠0). Dodaj dane lub przełącz stan.</div>}
          </div>
        </div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
