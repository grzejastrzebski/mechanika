const addBtn = 'flex items-center gap-1.5 text-xs px-3 py-1.5 text-cyan-300 hover:text-cyan-200 hover:bg-cyan-950/40 rounded transition-colors border border-cyan-900/40';

function StructureView({nodes, elements, supports, loads, results, viewMode, view, setView, momentSuffix}) {
  const svgRef = useRef(null);
  const dragRef = useRef(null);
  const W=760, H=520, padding=70;
  const is3D = viewMode === 'mz3d' || viewMode === 'ms3d';

  // Wheel handler with passive:false to enable preventDefault
  useEffect(() => {
    const svg = svgRef.current;
    if (!svg) return;
    const onWheel = (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      setView(v => ({...v, zoom: Math.max(0.1, Math.min(20, v.zoom * delta))}));
    };
    svg.addEventListener('wheel', onWheel, { passive: false });
    return () => svg.removeEventListener('wheel', onWheel);
  }, [setView]);

  const getSvgPoint = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / rect.width * W,
      y: (e.clientY - rect.top) / rect.height * H,
    };
  };

  const onMouseDown = (e) => {
    if (e.button !== 0) return;
    const pt = getSvgPoint(e);
    const isRotate = is3D && !e.shiftKey;
    dragRef.current = {
      startX: pt.x, startY: pt.y,
      startView: {...view},
      mode: isRotate ? 'rotate' : 'pan',
    };
  };

  const onMouseMove = (e) => {
    if (!dragRef.current) return;
    const pt = getSvgPoint(e);
    const dx = pt.x - dragRef.current.startX;
    const dy = pt.y - dragRef.current.startY;
    const sv = dragRef.current.startView;
    if (dragRef.current.mode === 'pan') {
      setView({...sv, panX: sv.panX + dx, panY: sv.panY + dy});
    } else {
      const newYaw = sv.yaw + (dx / W) * Math.PI * 1.5;
      const newPitch = Math.max(0.05, Math.min(Math.PI/2 - 0.05, sv.pitch - (dy / H) * Math.PI * 0.8));
      setView({...sv, yaw: newYaw, pitch: newPitch});
    }
  };

  const onMouseUp = () => { dragRef.current = null; };

  if (nodes.length === 0) return <div className="flex items-center justify-center h-full text-slate-500 text-sm">Dodaj węzły, aby zobaczyć schemat</div>;

  const cursor = is3D ? 'grab' : 'move';
  const svgProps = {
    ref: svgRef,
    onMouseDown, onMouseMove, onMouseUp, onMouseLeave: onMouseUp,
    style: {cursor, userSelect: 'none'},
    className: "w-full h-full",
  };

  // === AXONOMETRIC (3D) RENDERING for mz3d / ms3d ===
  if (is3D) {
    const yaw = view.yaw, pitch = view.pitch;
    const proj = (x, y, z) => {
      x = -x;
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      const xr = x*cy - y*sy;
      const yr = x*sy + y*cy;
      const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
      return {px: (xr-yr)*cosP, py: (xr+yr)*sinP - z};
    };

    let maxM = 0;
    if (results) results.elementForces.forEach(ef => {
      if (viewMode==='mz3d') maxM = Math.max(maxM, Math.abs(ef.Mint_left), Math.abs(ef.Mint_right));
      else maxM = Math.max(maxM, Math.abs(ef.Tint));
    });

    const baseProj = nodes.map(n => proj(parseFloat(n.x)||0, parseFloat(n.y)||0, 0));
    let allPx = baseProj.map(p => p.px);
    let allPy = baseProj.map(p => p.py);
    const sxMin=Math.min(...allPx), sxMax=Math.max(...allPx);
    const syMin=Math.min(...allPy), syMax=Math.max(...allPy);
    const structSize = Math.max(sxMax-sxMin, syMax-syMin, 1);
    const diagScale = maxM > 0 ? structSize * 0.45 / maxM : 0;

    if (results && diagScale > 0) {
      results.elementForces.forEach((ef, i) => {
        const el = elements[i]; if (!el) return;
        const n1 = nodes.find(n => n.id===el.n1), n2 = nodes.find(n => n.id===el.n2);
        if (!n1||!n2) return;
        let M1, M2;
        if (viewMode==='mz3d') { M1=ef.Mint_left; M2=ef.Mint_right; }
        else { M1=ef.Tint; M2=ef.Tint; }
        const x1=parseFloat(n1.x)||0, y1=parseFloat(n1.y)||0;
        const x2=parseFloat(n2.x)||0, y2=parseFloat(n2.y)||0;
        const t1=proj(x1,y1,M1*diagScale), t2=proj(x2,y2,M2*diagScale);
        allPx.push(t1.px, t2.px); allPy.push(t1.py, t2.py);
      });
    }

    const pxMin=Math.min(...allPx), pxMax=Math.max(...allPx);
    const pyMin=Math.min(...allPy), pyMax=Math.max(...allPy);
    const pdx=(pxMax-pxMin)||1, pdy=(pyMax-pyMin)||1;
    const sc = Math.min((W-2*padding)/pdx, (H-2*padding)/pdy);
    const ccx=(pxMin+pxMax)/2, ccy=(pyMin+pyMax)/2;
    const ps = (x,y,z) => { const p=proj(x,y,z); return [W/2+view.zoom*sc*(p.px-ccx)+view.panX, H/2+view.zoom*sc*(p.py-ccy)+view.panY]; };

    const dColor = viewMode==='mz3d' ? '#0891b2' : '#ea580c';
    const dFill = viewMode==='mz3d' ? 'rgba(34,211,238,0.30)' : 'rgba(251,146,60,0.30)';

    return (
      <svg viewBox={`0 0 ${W} ${H}`} {...svgProps}>
        <defs><pattern id="grid3d" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#dde7ef" strokeWidth="0.5"/></pattern></defs>
        <rect width={W} height={H} fill="url(#grid3d)"/>

        {/* Coordinate axes indicator */}
        <g transform={`translate(50, ${H-50})`}>
          {(() => {
            const L = 26;
            const xv = proj(1,0,0), yv = proj(0,1,0), zv = proj(0,0,1);
            return <>
              <line x1="0" y1="0" x2={L*xv.px} y2={L*xv.py} stroke="#5a6b80" strokeWidth="1.5"/>
              <text x={L*xv.px+5} y={L*xv.py+4} fill="#5a6b80" fontSize="11" fontFamily="monospace">x</text>
              <line x1="0" y1="0" x2={L*yv.px} y2={L*yv.py} stroke="#5a6b80" strokeWidth="1.5"/>
              <text x={L*yv.px-12} y={L*yv.py+4} fill="#5a6b80" fontSize="11" fontFamily="monospace">y</text>
              <line x1="0" y1="0" x2={L*zv.px} y2={L*zv.py} stroke="#5a6b80" strokeWidth="1.5"/>
              <text x={L*zv.px+5} y={L*zv.py+4} fill="#5a6b80" fontSize="11" fontFamily="monospace">z</text>
              <circle cx="0" cy="0" r="2" fill="#5a6b80"/>
            </>;
          })()}
        </g>

        {/* Mode label */}
        <g transform={`translate(${W-30}, 30)`}>
          <text textAnchor="end" fill={dColor} fontSize="14" fontFamily="monospace" fontWeight="bold">
            {viewMode==='mz3d' ? 'WYKRES Mz · aksonometria' : 'WYKRES Ms · aksonometria'}
          </text>
          {maxM > 0 && <text textAnchor="end" x="0" y="16" fill="#5a6b80" fontSize="10" fontFamily="monospace">max = {fmt(maxM, 2)}{momentSuffix||''}</text>}
        </g>

        {/* Diagram polygons (rendered first so structure shows on top) */}
        {results && diagScale > 0 && elements.map((el, i) => {
          const ef = results.elementForces[i]; if (!ef) return null;
          const n1 = nodes.find(n => n.id===el.n1), n2 = nodes.find(n => n.id===el.n2);
          if (!n1||!n2) return null;
          let M1, M2;
          if (viewMode==='mz3d') { M1=ef.Mint_left; M2=ef.Mint_right; }
          else { M1=ef.Tint; M2=ef.Tint; }
          const x1=parseFloat(n1.x)||0, y1=parseFloat(n1.y)||0;
          const x2=parseFloat(n2.x)||0, y2=parseFloat(n2.y)||0;
          const Lreal=ef.L, q=(viewMode==='mz3d') ? (ef.q||0) : 0;
          const [b1x, b1y] = ps(x1,y1,0), [b2x, b2y] = ps(x2,y2,0);
          const [t1x, t1y] = ps(x1,y1,M1*diagScale), [t2x, t2y] = ps(x2,y2,M2*diagScale);
          const lo1 = M1>=0 ? -7 : 16, lo2 = M2>=0 ? -7 : 16;
          const segs = q !== 0 ? 24 : 1;
          const tops = [];
          let Mmax = M1, pMaxX = t1x, pMaxY = t1y;
          for (let k=0; k<=segs; k++){
            const xi = k/segs;
            const xL = xi*Lreal;
            const M = M1*(1-xi) + M2*xi + q*xL*(Lreal-xL)/2;
            const xx = x1 + (x2-x1)*xi;
            const yy = y1 + (y2-y1)*xi;
            const [px, py] = ps(xx, yy, M*diagScale);
            tops.push(`${px},${py}`);
            if (q !== 0 && Math.abs(M) > Math.abs(Mmax)) { Mmax = M; pMaxX = px; pMaxY = py; }
          }
          const polyPoints = `${b1x},${b1y} ${tops.join(' ')} ${b2x},${b2y}`;
          const loMax = Mmax>=0 ? -7 : 16;
          return (
            <g key={`d3d-${el.id}`}>
              <polygon points={polyPoints} fill={dFill} stroke={dColor} strokeWidth="1.2"/>
              <line x1={b1x} y1={b1y} x2={t1x} y2={t1y} stroke={dColor} strokeWidth="1.2"/>
              <line x1={b2x} y1={b2y} x2={t2x} y2={t2y} stroke={dColor} strokeWidth="1.2"/>
              {Math.abs(M1)>1e-6 && <text x={t1x} y={t1y+lo1} textAnchor="middle" fill={dColor} fontSize="11" fontFamily="monospace" fontWeight="bold">{fmt(M1, 2)}{momentSuffix||''}</text>}
              {Math.abs(M2)>1e-6 && viewMode==='mz3d' && <text x={t2x} y={t2y+lo2} textAnchor="middle" fill={dColor} fontSize="11" fontFamily="monospace" fontWeight="bold">{fmt(M2, 2)}{momentSuffix||''}</text>}
              {q !== 0 && Math.abs(Mmax-M1)>1e-3 && Math.abs(Mmax-M2)>1e-3 && Math.abs(Mmax)>0.01 && (
                <g>
                  <circle cx={pMaxX} cy={pMaxY} r="2" fill={dColor}/>
                  <text x={pMaxX} y={pMaxY+loMax} textAnchor="middle" fill={dColor} fontSize="10" fontFamily="monospace" fontStyle="italic">{fmt(Mmax,2)}{momentSuffix||''}</text>
                </g>
              )}
            </g>
          );
        })}

        {/* Structure beams */}
        {elements.map(el => {
          const n1 = nodes.find(n => n.id===el.n1), n2 = nodes.find(n => n.id===el.n2);
          if (!n1||!n2) return null;
          const [x1, y1] = ps(parseFloat(n1.x)||0, parseFloat(n1.y)||0, 0);
          const [x2, y2] = ps(parseFloat(n2.x)||0, parseFloat(n2.y)||0, 0);
          return <line key={`b3d-${el.id}`} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#16243a" strokeWidth="2.8"/>;
        })}

        {/* Nodes */}
        {nodes.map(node => {
          const [px, py] = ps(parseFloat(node.x)||0, parseFloat(node.y)||0, 0);
          return (
            <g key={`n3d-${node.id}`}>
              <circle cx={px} cy={py} r="5" fill="#ffffff" stroke="#0891b2" strokeWidth="1.5"/>
              <text x={px+10} y={py+16} fill="#0891b2" fontSize="11" fontWeight="bold" fontFamily="monospace">{node.id}</text>
            </g>
          );
        })}
      </svg>
    );
  }
  // === END AXONOMETRIC ===

  const xs = nodes.map(n => parseFloat(n.x)||0), ys = nodes.map(n => parseFloat(n.y)||0);
  const xmin=Math.min(...xs), xmax=Math.max(...xs), ymin=Math.min(...ys), ymax=Math.max(...ys);
  const dx=(xmax-xmin)||1, dy=(ymax-ymin)||1;
  const scale = Math.min((W-2*padding)/dx, (H-2*padding)/dy);
  const cx=(xmin+xmax)/2, cy=(ymin+ymax)/2;
  const tx = x => W/2 + view.zoom*scale*(x-cx) + view.panX;
  const ty = y => H/2 - view.zoom*scale*(y-cy) + view.panY;

  const supMap = {}; supports.forEach(s => supMap[s.node]=s);
  const loadMap = {};
  loads.forEach(l => {
    if (!loadMap[l.node]) loadMap[l.node]={Fz:0,Mx:0,My:0};
    loadMap[l.node].Fz += parseFloat(l.Fz)||0;
    loadMap[l.node].Mx += parseFloat(l.Mx)||0;
    loadMap[l.node].My += parseFloat(l.My)||0;
  });

  let diagScale=0, maxVal=0;
  if (results && (viewMode==='mz' || viewMode==='ms')) {
    results.elementForces.forEach(ef => {
      if (viewMode==='mz') maxVal = Math.max(maxVal, Math.abs(ef.Mint_left), Math.abs(ef.Mint_right));
      else if (viewMode==='ms') maxVal = Math.max(maxVal, Math.abs(ef.Tint));
    });
    if (maxVal > 0) diagScale = Math.min(W,H)*0.18 / maxVal;
  }

  const diagColor = viewMode==='mz' ? '#0891b2' : '#ea580c';
  const diagFill = viewMode==='mz' ? 'rgba(8,145,178,0.18)' : 'rgba(234,88,12,0.18)';

  return (
    <svg viewBox={`0 0 ${W} ${H}`} {...svgProps}>
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#dde7ef" strokeWidth="0.5"/>
        </pattern>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="#5a6b80" strokeWidth="1"/>
        </pattern>
        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <polygon points="0 0, 10 3, 0 6" fill="#0891b2"/>
        </marker>
        <marker id="qArrow" markerWidth="6" markerHeight="6" refX="5" refY="2" orient="auto">
          <polygon points="0 0, 5 2, 0 4" fill="#ea580c"/>
        </marker>
      </defs>
      <rect width={W} height={H} fill="url(#grid)"/>
      <g transform={`translate(30, ${H-30})`}>
        <line x1="0" y1="0" x2="22" y2="0" stroke="#16243a" strokeWidth="1.5" markerEnd="url(#arrowhead)"/>
        <line x1="0" y1="0" x2="0" y2="-22" stroke="#16243a" strokeWidth="1.5" markerEnd="url(#arrowhead)"/>
        <text x="28" y="4" fill="#5a6b80" fontSize="10" fontFamily="monospace">x</text>
        <text x="-4" y="-26" fill="#5a6b80" fontSize="10" fontFamily="monospace">y</text>
        <circle cx="0" cy="0" r="3" fill="none" stroke="#16243a" strokeWidth="1"/>
        <circle cx="0" cy="0" r="0.8" fill="#16243a"/>
        <text x="6" y="-6" fill="#5a6b80" fontSize="9" fontFamily="monospace">z↑</text>
      </g>
      <g transform={`translate(${W-30}, 30)`}>
        <text textAnchor="end" fill={viewMode==='structure'?'#5a6b80':diagColor} fontSize="14" fontFamily="monospace" fontWeight="bold">
          {viewMode==='structure' && 'SCHEMAT'}
          {viewMode==='mz' && 'WYKRES Mz'}
          {viewMode==='ms' && 'WYKRES Ms'}
        </text>
        {(viewMode==='mz'||viewMode==='ms') && maxVal>0 && (
          <text textAnchor="end" x="0" y="16" fill="#5a6b80" fontSize="10" fontFamily="monospace">max = {fmt(maxVal,2)}{momentSuffix||''}</text>
        )}
      </g>
      {elements.map(el => {
        const n1=nodes.find(n=>n.id===el.n1), n2=nodes.find(n=>n.id===el.n2);
        if (!n1||!n2) return null;
        const x1=tx(parseFloat(n1.x)||0), y1=ty(parseFloat(n1.y)||0);
        const x2=tx(parseFloat(n2.x)||0), y2=ty(parseFloat(n2.y)||0);
        const mx=(x1+x2)/2, my=(y1+y2)/2;
        const ex=x2-x1, ey=y2-y1, elen=Math.sqrt(ex*ex+ey*ey)||1;
        const ux=ex/elen, uy=ey/elen;
        const hingeOffset = Math.min(elen*0.18, 14);
        return (
          <g key={`el-${el.id}`}>
            <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="#16243a" strokeWidth="2.5"/>
            {viewMode==='structure' && (<>
              <circle cx={mx} cy={my} r="9" fill="#ffffff" stroke="#16243a" strokeWidth="1"/>
              <text x={mx} y={my+3} textAnchor="middle" fill="#5a6b80" fontSize="9" fontFamily="monospace">{el.id}</text>
              {el.release1 && <HingeMark x={x1+ux*hingeOffset} y={y1+uy*hingeOffset} mg={el.release1.mg} ms={el.release1.ms}/>}
              {el.release2 && <HingeMark x={x2-ux*hingeOffset} y={y2-uy*hingeOffset} mg={el.release2.mg} ms={el.release2.ms}/>}
            </>)}
          </g>
        );
      })}
      {/* Wskaźniki obciążenia ciągłego q na prętach */}
      {viewMode==='structure' && elements.map(el => {
        const q = parseFloat(el.q) || 0;
        if (q === 0) return null;
        const n1=nodes.find(n=>n.id===el.n1), n2=nodes.find(n=>n.id===el.n2);
        if (!n1||!n2) return null;
        const x1=tx(parseFloat(n1.x)||0), y1=ty(parseFloat(n1.y)||0);
        const x2=tx(parseFloat(n2.x)||0), y2=ty(parseFloat(n2.y)||0);
        const ex=x2-x1, ey=y2-y1, L=Math.sqrt(ex*ex+ey*ey);
        if (L<1e-6) return null;
        const nx=ey/L, ny=-ex/L;
        const dashes = [];
        const numDashes = Math.max(5, Math.floor(L/16));
        const dashLen = 8;
        for (let k=0; k<=numDashes; k++){
          const t = k/numDashes;
          const cx = x1 + ex*t, cy = y1 + ey*t;
          const ax = cx + nx*dashLen, ay = cy + ny*dashLen;
          dashes.push({cx, cy, ax, ay, k});
        }
        const qColor = q < 0 ? '#ea580c' : '#7c3aed';
        const labX = (x1+x2)/2 + nx*16;
        const labY = (y1+y2)/2 + ny*16 + 4;
        return (
          <g key={`q-${el.id}`}>
            {dashes.map(d => (
              <line key={`q${el.id}-${d.k}`} x1={d.cx} y1={d.cy} x2={d.ax} y2={d.ay} stroke={qColor} strokeWidth="1.3" markerEnd="url(#qArrow)" opacity="0.85"/>
            ))}
            <text x={labX} y={labY} textAnchor="middle" fill={qColor} fontSize="11" fontFamily="monospace" fontWeight="bold">q={fmt(q,2)}</text>
          </g>
        );
      })}
      {results && viewMode==='mz' && diagScale>0 && elements.map((el,i) => {
        const ef=results.elementForces[i]; if (!ef) return null;
        const n1=nodes.find(n=>n.id===el.n1), n2=nodes.find(n=>n.id===el.n2);
        if (!n1||!n2) return null;
        const x1=tx(parseFloat(n1.x)||0), y1=ty(parseFloat(n1.y)||0);
        const x2=tx(parseFloat(n2.x)||0), y2=ty(parseFloat(n2.y)||0);
        const ex=x2-x1, ey=y2-y1, L=Math.sqrt(ex*ex+ey*ey);
        const nx=ey/L, ny=-ex/L;
        const M1=ef.Mint_left, M2=ef.Mint_right;
        const Lreal=ef.L, q=ef.q||0;
        const p1x=x1+nx*M1*diagScale, p1y=y1+ny*M1*diagScale;
        const p2x=x2+nx*M2*diagScale, p2y=y2+ny*M2*diagScale;
        // Wykres paraboliczny dla q != 0: M(x) = M1*(1-ξ) + M2*ξ + q*x*(L-x)/2
        const segs = q !== 0 ? 24 : 1;
        const tops = [];
        let Mmax = M1, xMax = 0, pMaxX = p1x, pMaxY = p1y;
        for (let k=0; k<=segs; k++){
          const xi = k/segs;
          const xL = xi*Lreal;
          const M = M1*(1-xi) + M2*xi + q*xL*(Lreal-xL)/2;
          const px = x1 + ex*xi + nx*M*diagScale;
          const py = y1 + ey*xi + ny*M*diagScale;
          tops.push(`${px},${py}`);
          if (q !== 0 && Math.abs(M) > Math.abs(Mmax)) { Mmax = M; xMax = xi; pMaxX = px; pMaxY = py; }
        }
        const polyPoints = `${x1},${y1} ${tops.join(' ')} ${x2},${y2}`;
        return (
          <g key={`mz-${el.id}`}>
            <polygon points={polyPoints} fill={diagFill} stroke={diagColor} strokeWidth="1.2"/>
            <line x1={x1} y1={y1} x2={p1x} y2={p1y} stroke={diagColor} strokeWidth="0.8" strokeDasharray="2,2"/>
            <line x1={x2} y1={y2} x2={p2x} y2={p2y} stroke={diagColor} strokeWidth="0.8" strokeDasharray="2,2"/>
            <text x={p1x+nx*8} y={p1y+ny*8+4} textAnchor="middle" fill={diagColor} fontSize="11" fontFamily="monospace" fontWeight="bold">{fmt(M1,2)}{momentSuffix||''}</text>
            <text x={p2x+nx*8} y={p2y+ny*8+4} textAnchor="middle" fill={diagColor} fontSize="11" fontFamily="monospace" fontWeight="bold">{fmt(M2,2)}{momentSuffix||''}</text>
            {q !== 0 && Math.abs(Mmax-M1)>1e-3 && Math.abs(Mmax-M2)>1e-3 && Math.abs(Mmax)>0.01 && (
              <g>
                <circle cx={pMaxX} cy={pMaxY} r="2" fill={diagColor}/>
                <text x={pMaxX+nx*10} y={pMaxY+ny*10+4} textAnchor="middle" fill={diagColor} fontSize="10" fontFamily="monospace" fontStyle="italic">{fmt(Mmax,2)}{momentSuffix||''}</text>
              </g>
            )}
          </g>
        );
      })}
      {results && viewMode==='ms' && diagScale>0 && elements.map((el,i) => {
        const ef=results.elementForces[i]; if (!ef) return null;
        const n1=nodes.find(n=>n.id===el.n1), n2=nodes.find(n=>n.id===el.n2);
        if (!n1||!n2) return null;
        const x1=tx(parseFloat(n1.x)||0), y1=ty(parseFloat(n1.y)||0);
        const x2=tx(parseFloat(n2.x)||0), y2=ty(parseFloat(n2.y)||0);
        const ex=x2-x1, ey=y2-y1, L=Math.sqrt(ex*ex+ey*ey);
        const nx=ey/L, ny=-ex/L;
        const Tval=ef.Tint, off=Tval*diagScale;
        const p1x=x1+nx*off, p1y=y1+ny*off, p2x=x2+nx*off, p2y=y2+ny*off;
        const midx=(p1x+p2x)/2, midy=(p1y+p2y)/2;
        return (
          <g key={`ms-${el.id}`}>
            <polygon points={`${x1},${y1} ${p1x},${p1y} ${p2x},${p2y} ${x2},${y2}`} fill={diagFill} stroke={diagColor} strokeWidth="1.2"/>
            <line x1={x1} y1={y1} x2={p1x} y2={p1y} stroke={diagColor} strokeWidth="0.8" strokeDasharray="2,2"/>
            <line x1={x2} y1={y2} x2={p2x} y2={p2y} stroke={diagColor} strokeWidth="0.8" strokeDasharray="2,2"/>
            <text x={midx+nx*10} y={midy+ny*10+4} textAnchor="middle" fill={diagColor} fontSize="11" fontFamily="monospace" fontWeight="bold">{fmt(Tval,2)}{momentSuffix||''}</text>
          </g>
        );
      })}
      {nodes.map(node => {
        const sup=supMap[node.id]; if (!sup) return null;
        const px=tx(parseFloat(node.x)||0), py=ty(parseFloat(node.y)||0);
        const fixedAll = sup.z && sup.rx && sup.ry, onlyZ = sup.z && !sup.rx && !sup.ry;
        return (
          <g key={`sup-${node.id}`}>
            {fixedAll && <rect x={px-14} y={py-14} width="28" height="28" fill="url(#hatch)" stroke="#5a6b80" strokeWidth="1"/>}
            {onlyZ && (<>
              <polygon points={`${px},${py} ${px-10},${py+16} ${px+10},${py+16}`} fill="none" stroke="#5a6b80" strokeWidth="1.5"/>
              <line x1={px-14} y1={py+18} x2={px+14} y2={py+18} stroke="#5a6b80" strokeWidth="1"/>
            </>)}
            {!fixedAll && !onlyZ && <circle cx={px} cy={py} r="13" fill="none" stroke="#5a6b80" strokeWidth="1" strokeDasharray="3,2"/>}
          </g>
        );
      })}
      {nodes.map(node => {
        const px=tx(parseFloat(node.x)||0), py=ty(parseFloat(node.y)||0);
        return (
          <g key={`node-${node.id}`}>
            <circle cx={px} cy={py} r="5" fill="#ffffff" stroke="#0891b2" strokeWidth="1.5"/>
            <text x={px+9} y={py-9} fill="#0891b2" fontSize="11" fontWeight="bold" fontFamily="monospace">{node.id}</text>
          </g>
        );
      })}
      {viewMode==='structure' && nodes.map(node => {
        const ld=loadMap[node.id]; if (!ld) return null;
        const px=tx(parseFloat(node.x)||0), py=ty(parseFloat(node.y)||0);
        const items=[];
        if (Math.abs(ld.Fz)>1e-9) {
          const sym = ld.Fz<0 ? '⊗' : '⊙';
          items.push(<g key="fz">
            <text x={px-18} y={py-14} fill="#ea580c" fontSize="18" fontWeight="bold">{sym}</text>
            <text x={px-35} y={py-2} fill="#ea580c" fontSize="10" fontFamily="monospace">{fmt(ld.Fz,1)}</text>
          </g>);
        }
        if (Math.abs(ld.Mx)>1e-9 || Math.abs(ld.My)>1e-9) {
          items.push(<text key="m" x={px+12} y={py+22} fill="#7c3aed" fontSize="9" fontFamily="monospace">M({fmt(ld.Mx,1)},{fmt(ld.My,1)})</text>);
        }
        return <g key={`load-${node.id}`}>{items}</g>;
      })}
    </svg>
  );
}

// Ułamek pionowy (np. EJ/GC, 1/3) — do zapisu równań w stylu odręcznym.
function VFrac({n, d}) {
  return (
    <span className="inline-flex flex-col text-center align-middle mx-1 text-sm leading-none">
      <span className="border-b border-current px-0.5">{n}</span>
      <span className="px-0.5">{d}</span>
    </span>
  );
}

// Owija liczby ujemne w nawiasy (np. "-4.00" -> "(-4.00)") — wymóg zapisu odręcznego z instrukcji.
function parenNeg(str) {
  return String(str).replace(/(-[\d.]+(?:e-?\d+)?)/g, '($1)');
}

// Czytelne mapowanie wiodącego znaku ułamka unicode (z multiplicationFormula) na licznik/mianownik.
const FRAC_MAP = { '⅓': [1,3], '⅙': [1,6], '½': [1,2] };

// Lekki, "wpleciony w tekst" wykres — tylko obrys kształtu, plus etykiety rzędnych na obu
// końcach (lewej i prawej, np. dla trapezu — różne wartości po obu stronach) i etykieta
// długości pręta (s) pod osią; bez tytułu/siatki. Używany zarówno dla Mz (M1/M2/q dowolne), jak
// i dla Ms (przekazujemy M1=M2=T, q=0 — stały rozkład wzdłuż pręta wygląda jak prostokąt).
// Górny/dolny margines (topMargin/bottomMargin) rezerwuje miejsce na etykiety, żeby nie były
// przycinane przez viewBox.
function InlineDiagram({M1, M2, q=0, L, color='#0891b2'}) {
  const w = 112, h = 80, pad = 4, topMargin = 16, bottomMargin = 18;
  const halfSpan = (h - topMargin - bottomMargin) / 2;
  const baseY = topMargin + halfSpan;
  const segs = Math.abs(q) > 1e-9 ? 12 : 1;
  const vals = [];
  for (let k=0; k<=segs; k++) { const xi=k/segs, xL=xi*L; vals.push(M1*(1-xi)+M2*xi+q*xL*(L-xL)/2); }
  const maxAbs = Math.max(Math.abs(M1), Math.abs(M2), ...vals.map(Math.abs), 1e-9);
  // baseY na środku dostępnej wysokości (po odjęciu marginesów) — symetryczny zapas miejsca dla
  // wartości +/- (inaczej ujemne rzędne, np. stałe Ms < 0, wychodzą poza viewBox i są przycinane).
  const yScale = (halfSpan - 2) / maxAbs;
  const pts = [[pad, baseY]];
  let mid = {val: 0, x: w / 2, y: baseY};
  for (let k=0; k<=segs; k++) {
    const xi=k/segs, xL=xi*L;
    const M = M1*(1-xi)+M2*xi+q*xL*(L-xL)/2;
    const px = pad+xi*(w-2*pad), py = baseY-M*yScale;
    pts.push([px, py]);
    if (Math.abs(M) > Math.abs(mid.val)) mid = {val: M, x: px, y: py};
  }
  pts.push([w-pad, baseY]);
  const poly = pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const y1 = baseY - M1*yScale, y2 = baseY - M2*yScale;
  const hasEnds = Math.abs(M1) > 1e-9 || Math.abs(M2) > 1e-9;
  // Gdy obie wartości brzegowe są zerowe (czysta parabola od q, np. trójkąt/parabola z M1=M2=0),
  // brak etykiet na końcach — pokaż etykietę w punkcie maksimum (środek łuku) zamiast nich.
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} className="inline-block align-middle" style={{verticalAlign:'middle'}}>
      <line x1={pad} y1={baseY} x2={w-pad} y2={baseY} stroke={color} strokeWidth="0.75" opacity="0.5"/>
      <polygon points={poly} fill={`${color}33`} stroke={color} strokeWidth="1.2"/>
      {Math.abs(M1) > 1e-9 && (
        <text x={pad} y={M1 >= 0 ? y1 - 5 : y1 + 13} textAnchor="start"
              fontSize="11" fontFamily="sans-serif" fill={color}>{fmt(M1, 2)}</text>
      )}
      {Math.abs(M2) > 1e-9 && (
        <text x={w-pad} y={M2 >= 0 ? y2 - 5 : y2 + 13} textAnchor="end"
              fontSize="11" fontFamily="sans-serif" fill={color}>{fmt(M2, 2)}</text>
      )}
      {!hasEnds && Math.abs(mid.val) > 1e-9 && (
        <text x={mid.x} y={mid.val >= 0 ? mid.y - 5 : mid.y + 13} textAnchor="middle"
              fontSize="11" fontFamily="sans-serif" fill={color}>{fmt(mid.val, 2)}</text>
      )}
      <text x={w/2} y={h-4} textAnchor="middle" fontSize="10" fontFamily="sans-serif" fill="#64748b">s={fmt(L, 2)}</text>
    </svg>
  );
}

// Panel rozkładu Wereszczagina dla wybranej pary stanów
// Renderuje jeden człon liczbowy z multiplicationFormula (Linia 3): wiodący ułamek (⅓/⅙/½),
// jeśli występuje, jako pionowy <VFrac>, a pozostałe czynniki (rozdzielone "·") z nawiasami na
// liczbach ujemnych. Ogólny przypadek (trapez/parabola) jest zbyt złożony na rozbicie na czynniki
// — pokazujemy go w całości jako jeden blok tekstu (wciąż z nawiasami na liczbach ujemnych).
function renderNumericTerm(formula, computation, key) {
  const frac = FRAC_MAP[formula[0]];
  if (frac || formula === 's·a·b') {
    const body = frac ? computation.slice(1).replace(/^·/, '') : computation;
    const factors = body.split('·').filter(Boolean);
    return (
      <span key={key} className="whitespace-nowrap">
        {frac && <><VFrac n={frac[0]} d={frac[1]}/><span className="mx-0.5">·</span></>}
        {factors.map((f, i) => <React.Fragment key={i}>{i > 0 && <span className="mx-0.5">·</span>}{parenNeg(f)}</React.Fragment>)}
      </span>
    );
  }
  return <span key={key} className="whitespace-nowrap">{parenNeg(computation)}</span>;
}

// Panel rozkładu Wereszczagina dla wybranej pary stanów — zapisany jako spójny, wieloliniowy
// ciąg matematyczny (styl odręczny): (1) wzór ogólny, (2) wykresy wplecione w równanie,
// (3) podstawienie liczbowe, (4) wynik końcowy. Pomijamy człony, których iloczyn jest
// tożsamościowo zerowy (jeden z wykresów = 0 / T0 albo T1 = 0) — w zapisie odręcznym też się je
// po prostu nie pisze.
function WereshchaginPanel({deltas, pairKey, label, sym}) {
  if (!deltas?.perBeam) return null;
  const i0 = pairKey[0], i1 = pairKey[1];
  const sufM0 = mSufInline(i0, sym);
  const sufM1 = mSufInline(i1, sym);
  const sufL = lSufInline(sym);
  const sufProd = productSufInline(i0, i1, sym);
  const pickM = (b, st) => st==='0' ? {a: b.M0a, bb: b.M0b, q: b.q0} :
                           st==='1' ? {a: b.M1a, bb: b.M1b, q: b.q1} :
                                      {a: b.M2a||0, bb: b.M2b||0, q: b.q2||0};
  const pickT = (b, st) => st==='0' ? b.T0 : st==='1' ? b.T1 : (b.T2||0);
  const colorMz0 = '#0891b2', colorMz1 = '#7c3aed';
  const colorMs0 = '#ea580c', colorMs1 = '#db2777';

  // Próg 1e-6 (zamiast samego typu 'zero' z classifyShape) odsiewa też szum numeryczny solvera
  // (rzędu 1e-10..1e-9, poniżej progu fmt() pokazującego "0", ale powyżej względnego epsilona
  // classifyShape) — bez tego w zapisie odręcznym pojawiałyby się człony typu "1.00·0·0 = 0".
  const mzTerms = [], msTerms = [];
  deltas.perBeam.forEach(b => {
    const v0 = pickM(b, i0), v1 = pickM(b, i1);
    const M0a = v0.a, M0b = v0.bb, q0 = v0.q;
    const M1a = v1.a, M1b = v1.bb, q1 = v1.q;
    const s0 = classifyShape(M0a, M0b, q0, b.L);
    const s1 = classifyShape(M1a, M1b, q1, b.L);
    const info = multiplicationFormula(s0, s1, b.L, sym, i0, i1);
    if (Math.abs(info.value) > 1e-6) {
      mzTerms.push({ b, M0a, M0b, q0, M1a, M1b, q1, info });
    }
    const T0 = pickT(b, i0), T1 = pickT(b, i1);
    if (Math.abs(T0 * T1 * b.L) > 1e-6) {
      msTerms.push({ b, T0, T1 });
    }
  });

  const sums = deltas.sums;
  const mzSum = sums[`mz${pairKey}`] || 0;
  const msSum = sums[`ms${pairKey}`] || 0;
  const totalKeyMap = {'00':'delta00', '11':'delta11', '10':'delta10', '22':'delta22', '20':'delta20', '12':'delta12'};
  const total = deltas[totalKeyMap[pairKey]] || 0;
  const sub = pairKey;
  const totalSuf = (() => {
    if (!sym || !sym.enabled || !sym.types) return '';
    const f0 = factorForType(sym.types[parseInt(i0)]);
    const f1 = factorForType(sym.types[parseInt(i1)]);
    if (!f0 || !f1) return '';
    return formatUnit(f0.P + f1.P, f0.Q + f1.Q, f0.L + f1.L + 1, true);
  })();

  return (
    <div className="bg-slate-950/40 border border-emerald-800/40 rounded-lg p-4 mt-3 font-serif [&_sup]:text-[0.8em] [&_sub]:text-[0.8em]">
      <div className="text-xs uppercase tracking-wider text-emerald-300 mb-3 font-semibold flex items-center gap-3 flex-wrap font-sans not-italic">
        <span>{label}</span>
        <span className="bg-amber-950/40 border border-amber-700/40 rounded px-2 py-0.5 normal-case tracking-normal text-amber-200 font-mono">EJ/GC = {fmt(deltas.EI_over_GJ, 3)}</span>
      </div>

      {/* Linia 1: wzór ogólny */}
      <div className="text-lg text-slate-200 mb-3">
        δ<sub>{sub}</sub> = (1/EJ) · [∫Mz<sup>{i0}</sup>·Mz<sup>{i1}</sup> ds + <VFrac n="EJ" d="GC"/>· ∫Ms<sup>{i0}</sup>·Ms<sup>{i1}</sup> ds]
      </div>

      {/* Linia 2: równanie graficzne — wykresy wplecione w tekst */}
      <div className="flex flex-wrap items-center gap-y-2 gap-x-1.5 text-base text-slate-200 mb-2">
        <span>= (1/EJ)</span><span className="text-4xl font-light leading-none">[</span>
        {mzTerms.map((t, i) => (
          <React.Fragment key={`mzg${i}`}>
            {i > 0 && <span className="text-slate-400">+</span>}
            <InlineDiagram M1={t.M0a} M2={t.M0b} q={t.q0} L={t.b.L} color={colorMz0}/>
            <span className="text-slate-400">·</span>
            <InlineDiagram M1={t.M1a} M2={t.M1b} q={t.q1} L={t.b.L} color={colorMz1}/>
          </React.Fragment>
        ))}
        <span className="text-4xl font-light leading-none">]</span>
        {msTerms.length > 0 && <>
          <span className="text-slate-400">+</span><VFrac n="EJ" d="GC"/>
          <span className="text-4xl font-light leading-none">(</span>
          {msTerms.map((t, i) => (
            <React.Fragment key={`msg${i}`}>
              {i > 0 && <span className="text-slate-400">+</span>}
              <InlineDiagram M1={t.T0} M2={t.T0} L={t.b.L} color={colorMs0}/>
              <span className="text-slate-400">·</span>
              <InlineDiagram M1={t.T1} M2={t.T1} L={t.b.L} color={colorMs1}/>
            </React.Fragment>
          ))}
          <span className="text-4xl font-light leading-none">)</span>
        </>}
      </div>

      {/* Linia 3: podstawienie liczbowe */}
      <div className="flex flex-wrap items-center gap-y-2 gap-x-1.5 text-base text-slate-200 mb-3">
        <span>= (1/EJ)</span><span className="text-4xl font-light leading-none">[</span>
        {mzTerms.map((t, i) => (
          <React.Fragment key={`mzn${i}`}>
            {i > 0 && <span className="text-slate-400">+</span>}
            {renderNumericTerm(t.info.formula, t.info.computation, `mznn${i}`)}
          </React.Fragment>
        ))}
        <span className="text-4xl font-light leading-none">]</span>
        {msTerms.length > 0 && <>
          <span className="text-slate-400">+</span><VFrac n="EJ" d="GC"/>
          <span className="text-4xl font-light leading-none">(</span>
          {msTerms.map((t, i) => (
            <React.Fragment key={`msn${i}`}>
              {i > 0 && <span className="text-slate-400">+</span>}
              <span className="whitespace-nowrap">{parenNeg(fmt(t.b.L,2))}{sufL}·{parenNeg(fmt(t.T0,2))}{sufM0}·{parenNeg(fmt(t.T1,2))}{sufM1}</span>
            </React.Fragment>
          ))}
          <span className="text-4xl font-light leading-none">)</span>
        </>}
      </div>

      {/* Linia 4: wynik końcowy */}
      {deltas.uniform ? (
        <div className="text-lg text-slate-200 border-t border-slate-800 pt-2">
          = (1/{fmt(deltas.EI_ref,2)}) · [<span className="text-emerald-300 font-bold">{fmt(mzSum,4)}{sufProd}</span> + {fmt(deltas.EI_over_GJ,3)}·<span className="text-emerald-300 font-bold">{fmt(msSum,4)}{sufProd}</span>] = <span className="font-bold text-emerald-200 text-xl">{fmt(total, 4)}{totalSuf?' '+totalSuf:''}</span>
        </div>
      ) : (
        <div className="text-lg text-slate-200 border-t border-slate-800 pt-2">
          = <span className="font-bold text-emerald-200 text-xl">{fmt(total, 4)}{totalSuf?' '+totalSuf:''}</span> <span className="text-slate-500 text-xs font-sans not-italic">(różne EJ/GC po prętach – sumacja składowa)</span>
        </div>
      )}
    </div>
  );
}

function Stepper({stage, onBack}) {
  const steps = ['Schemat', 'Stany', 'Obliczenia'];
  return (
    <div className="flex items-center">
      {steps.map((name, i) => {
        const s = i + 1;
        const done = stage > s, active = stage === s, future = stage < s;
        return (
          <React.Fragment key={s}>
            <button
              onClick={() => done && onBack(s)}
              disabled={!done}
              title={done ? `Wróć do etapu ${s}` : undefined}
              className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors
                ${active ? 'bg-cyan-500/15 text-cyan-300 ring-1 ring-cyan-500/40' :
                  done ? 'text-emerald-400 hover:bg-emerald-950/40 cursor-pointer' :
                  'text-slate-500 cursor-default'}`}
            >
              <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold flex-shrink-0
                ${active ? 'bg-cyan-500/30 ring-1 ring-cyan-500 text-cyan-200' :
                  done ? 'bg-emerald-500/20 ring-1 ring-emerald-600 text-emerald-300' :
                  'bg-slate-800 text-slate-500'}`}>
                {done ? '✓' : s}
              </span>
              {name}
            </button>
            {i < 2 && <div className={`w-5 h-px mx-0.5 ${done ? 'bg-emerald-700' : stage > i ? 'bg-slate-600' : 'bg-slate-800'}`}/>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

// Prosta strzałka (siła) — wektorowa, obracalna, kolor przez prop. Domyślnie skierowana w górę.
function ForceArrow({x, y, angle=0, length=18, color='#0891b2'}) {
  return (
    <g transform={`translate(${x} ${y}) rotate(${angle})`}>
      <line x1="0" y1="0" x2="0" y2={-length} stroke={color} strokeWidth="1.6"/>
      <path d={`M -3 ${-length+5} L 0 ${-length} L 3 ${-length+5}`} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    </g>
  );
}

// Strzałka łukowa (moment) — ~270° łuk z grotem na końcu, obracalna, kolor przez prop.
function MomentArrow({x, y, radius=11, angle=0, color='#0891b2', ccw=false}) {
  const sweep = ccw ? 0 : 1;
  const startA = 0, endA = ccw ? 90 : -90; // łuk ~270° (od startA, idąc "dłuższą drogą")
  const toRad = a => a * Math.PI / 180;
  const sx = radius * Math.cos(toRad(startA)), sy = radius * Math.sin(toRad(startA));
  const ex = radius * Math.cos(toRad(endA)), ey = radius * Math.sin(toRad(endA));
  const largeArc = 1;
  // grot na końcu łuku, tangencjalny do okręgu
  const tangentA = endA + (ccw ? -90 : 90);
  const headLen = 4.5;
  const hx1 = ex + headLen * Math.cos(toRad(tangentA + 150)), hy1 = ey + headLen * Math.sin(toRad(tangentA + 150));
  const hx2 = ex + headLen * Math.cos(toRad(tangentA - 150)), hy2 = ey + headLen * Math.sin(toRad(tangentA - 150));
  return (
    <g transform={`translate(${x} ${y}) rotate(${angle})`}>
      <path d={`M ${sx} ${sy} A ${radius} ${radius} 0 ${largeArc} ${sweep} ${ex} ${ey}`} fill="none" stroke={color} strokeWidth="1.6"/>
      <path d={`M ${hx1} ${hy1} L ${ex} ${ey} L ${hx2} ${hy2}`} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    </g>
  );
}

// Presety typów podpór dla rusztu (DOF: z, rx, ry). "Własna" = sentinel bez ustawionej kombinacji.
const SUPPORT_PRESETS = [
  { key: 'fixed',   label: 'Utwierdzenie',                          dof: {z:true,  rx:true,  ry:true} },
  { key: 'pin',     label: 'Podpora przegubowa',                    dof: {z:true,  rx:false, ry:false} },
  { key: 'dirRx',   label: 'Podpora kierunkowa (blokuje skręt)',     dof: {z:true,  rx:true,  ry:false} },
  { key: 'dirRy',   label: 'Podpora kierunkowa (blokuje zginanie)',  dof: {z:true,  rx:false, ry:true} },
  { key: 'custom',  label: 'Własna…',                                dof: null },
];
function matchSupportPreset(sup) {
  const found = SUPPORT_PRESETS.find(p => p.dof && !!p.dof.z===!!sup.z && !!p.dof.rx===!!sup.rx && !!p.dof.ry===!!sup.ry);
  return found ? found.key : 'custom';
}
// Mała grafika podglądowa presetu: strzałka dla z, łuk dla rx/ry.
function SupportPresetIcon({dof, size=34, color='#0891b2'}) {
  if (!dof) return <svg width={size} height={size} viewBox="0 0 34 34"><text x="17" y="21" textAnchor="middle" fontSize="9" fill={color} fontFamily="monospace">?</text></svg>;
  const cx = 17, cy = 24;
  return (
    <svg width={size} height={size} viewBox="0 0 34 34">
      <circle cx={cx} cy={cy} r="2.5" fill="#fff" stroke={color} strokeWidth="1.2"/>
      {dof.z && <ForceArrow x={cx} y={cy} angle={0} length={14} color={color}/>}
      {dof.rx && <MomentArrow x={cx} y={cy} radius={dof.z?8:7} angle={-45} color={color}/>}
      {dof.ry && <MomentArrow x={cx} y={cy} radius={dof.z?(dof.rx?12:8):7} angle={-45} color={color} ccw/>}
    </svg>
  );
}

// Przeguby na końcach prętów: presety wyboru, co zwalniają (Mg = moment gnący, Ms = moment skrętny).
const RELEASE_OPTIONS = [
  { key: 'none', label: 'Brak',           mg: false, ms: false },
  { key: 'mg',   label: 'Mg (zginający)', mg: true,  ms: false },
  { key: 'ms',   label: 'Ms (skrętny)',   mg: false, ms: true  },
  { key: 'both', label: 'Mg+Ms (pełny)',  mg: true,  ms: true  },
];
function releaseKey(r) {
  if (!r || (!r.mg && !r.ms)) return 'none';
  if (r.mg && r.ms) return 'both';
  return r.mg ? 'mg' : 'ms';
}
// Symbol przegubu na schemacie: otwarte kółko przy końcu pręta, z podpisem zwalnianej składowej.
function HingeMark({x, y, mg, ms, v, size=5, color='#d97706'}) {
  if (!mg && !ms && !v) return null;
  const label = [mg && 'g', ms && 's', v && 'T'].filter(Boolean).join(',');
  return (
    <g>
      <circle cx={x} cy={y} r={size} fill="#fff" stroke={color} strokeWidth="1.6"/>
      <text x={x} y={y-size-3} textAnchor="middle" fill={color} fontSize="7" fontFamily="monospace" fontWeight="bold">{label}</text>
    </g>
  );
}

// Rzutowanie aksonometryczne (kamera jak StructureView w trybie 3D, ale obrócona o 45° w
// prawo — klasyczna aksonometria inżynierska — żeby układ podstawowy w Etapie 2 był
// zorientowany przodem do użytkownika; statyczna, bez przeciągania).
function MiniBasicSystem({nodes, elements, supports, removedConstraints, width=130, height=85}) {
  const svgRef = useRef(null);
  const dragRef = useRef(null);
  const [view, setView] = useState({ yaw: -Math.PI / 4, pitch: Math.PI / 6, zoom: 1, panX: 0, panY: 0 });

  // Wheel handler z passive:false, żeby preventDefault zablokował scroll strony przy zoomie.
  useEffect(() => {
    const svg = svgRef.current;
    if (!svg) return;
    const onWheel = (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      setView(v => ({...v, zoom: Math.max(0.1, Math.min(20, v.zoom * delta))}));
    };
    svg.addEventListener('wheel', onWheel, { passive: false });
    return () => svg.removeEventListener('wheel', onWheel);
  }, []);

  const getSvgPoint = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / rect.width * width,
      y: (e.clientY - rect.top) / rect.height * height,
    };
  };
  const onMouseDown = (e) => {
    if (e.button !== 0) return;
    const pt = getSvgPoint(e);
    dragRef.current = { startX: pt.x, startY: pt.y, startView: {...view}, mode: e.shiftKey ? 'pan' : 'rotate' };
  };
  const onMouseMove = (e) => {
    if (!dragRef.current) return;
    const pt = getSvgPoint(e);
    const dx = pt.x - dragRef.current.startX;
    const dy = pt.y - dragRef.current.startY;
    const sv = dragRef.current.startView;
    if (dragRef.current.mode === 'pan') {
      setView({...sv, panX: sv.panX + dx, panY: sv.panY + dy});
    } else {
      const newYaw = sv.yaw + (dx / width) * Math.PI * 1.5;
      const newPitch = Math.max(0.05, Math.min(Math.PI/2 - 0.05, sv.pitch - (dy / height) * Math.PI * 0.8));
      setView({...sv, yaw: newYaw, pitch: newPitch});
    }
  };
  const onMouseUp = () => { dragRef.current = null; };

  if (!nodes.length) return null;
  const pad = 14;
  const { yaw, pitch } = view;
  const proj = (x, y, z) => {
    x = -x;
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    const xr = x * cy - y * sy;
    const yr = x * sy + y * cy;
    const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
    return { px: (xr - yr) * cosP, py: (xr + yr) * sinP - z };
  };

  const nodeMap = {};
  nodes.forEach(n => { nodeMap[n.id] = n; });
  const getXY = node => [parseFloat(node.x) || 0, parseFloat(node.y) || 0];
  // Kierunek osi pręta w węźle (do rozstawienia pary strzałek/łuków po obu stronach rozcięcia).
  const elementAxisDir = (elementId, atNodeId) => {
    const el = elements.find(e => e.id === elementId);
    if (!el) return [1, 0];
    const otherId = el.n1 === atNodeId ? el.n2 : el.n1;
    const a = nodeMap[atNodeId], b = nodeMap[otherId];
    if (!a || !b) return [1, 0];
    const [ax, ay] = getXY(a), [bx, by] = getXY(b);
    const dx = bx - ax, dy = by - ay;
    const len = Math.hypot(dx, dy) || 1;
    return [dx / len, dy / len];
  };

  const supMap = {};
  supports.forEach(s => { supMap[s.node] = s; });
  const removedSet = new Set(removedConstraints.filter(r => r.kind !== 'internal').map(r => `${r.node}:${r.dof}`));

  // Przebieg 1: rzut samej geometrii (z=0), żeby ustalić rozmiar konstrukcji i z niego wyskalować
  // proporcjonalnie długości strzałek/łuków, zanim policzymy ostateczny bounding box.
  const baseProj = nodes.map(n => { const [x, y] = getXY(n); return proj(x, y, 0); });
  const bx0 = baseProj.map(p => p.px), by0 = baseProj.map(p => p.py);
  const structSize = Math.max(Math.max(...bx0) - Math.min(...bx0), Math.max(...by0) - Math.min(...by0), 1);
  const arrowLen = structSize * 0.45;
  const momentRadius = structSize * 0.18;
  const axisOffset = structSize * 0.14;

  // Opis każdej strzałki/łuku w przestrzeni modelu (jeszcze nie zrzutowanej na ekran) — zarówno do
  // obliczenia prawdziwego 3D bounding boxa, jak i do narysowania jedną, wspólną transformacją `ps`.
  const annotations = [];
  removedConstraints.forEach((rc, i) => {
    const color = ['#7c3aed', '#db2777', '#d97706'][i] || '#e11d48';
    if (rc.kind === 'internal') {
      const node = nodeMap[rc.node]; if (!node) return;
      const [nx, ny] = getXY(node);
      const [dx, dy] = elementAxisDir(rc.elementId, rc.node);
      const sameNodeInternal = removedConstraints.filter(r => r.node === rc.node && r.kind === 'internal');
      const localIdx = sameNodeInternal.indexOf(rc);
      const fan = localIdx * axisOffset * 0.9;
      const off = axisOffset + fan;
      const p1 = [nx - dx * off, ny - dy * off];
      const p2 = [nx + dx * off, ny + dy * off];
      if (rc.relType === 'v') {
        // Rozcięcie siły tnącej: para przeciwnych strzałek pionowych po obu stronach przecięcia.
        annotations.push({ type: 'shearPair', i, color, xi: rc.xi, p1, p2, h: arrowLen * 0.55 });
      } else {
        // Rozcięcie momentu (Mg/Ms): para przeciwnych łuków — reprezentuje parę sił na przecięciu.
        annotations.push({ type: 'momentPair', i, color, xi: rc.xi, p1, p2, radius: momentRadius * 0.75, ccwFirst: rc.relType === 'ms' });
      }
    } else {
      const node = nodeMap[rc.node]; if (!node) return;
      const [nx, ny] = getXY(node);
      if (rc.dof === 'z') {
        const sameNodeForces = removedConstraints.filter(r => r.node === rc.node && r.kind !== 'internal' && r.dof === 'z');
        const localIdx = sameNodeForces.indexOf(rc);
        annotations.push({ type: 'forceUp', i, color, xi: rc.xi, p: [nx + localIdx * axisOffset * 0.5, ny], h: arrowLen });
      } else {
        const sameNodeMoments = removedConstraints.filter(r => r.node === rc.node && r.kind !== 'internal' && r.dof !== 'z');
        const localIdx = sameNodeMoments.indexOf(rc);
        annotations.push({ type: 'moment', i, color, xi: rc.xi, p: [nx, ny], radius: momentRadius + localIdx * momentRadius * 0.55, ccw: rc.dof === 'ry' });
      }
    }
  });

  // Przebieg 2: zbieramy wszystkie punkty 3D, które faktycznie narysujemy (węzły + groty strzałek/
  // łuki), żeby jeden wspólny skala+offset (`ps`) zmieścił całość — w tym nowe strzałki 3D — w SVG.
  let allPx = [], allPy = [];
  const pushP = (x, y, z) => { const p = proj(x, y, z); allPx.push(p.px); allPy.push(p.py); };
  nodes.forEach(n => { const [x, y] = getXY(n); pushP(x, y, 0); });
  annotations.forEach(a => {
    if (a.type === 'forceUp') { pushP(a.p[0], a.p[1], 0); pushP(a.p[0], a.p[1], a.h); }
    else if (a.type === 'moment') { pushP(a.p[0] - a.radius, a.p[1] - a.radius, 0); pushP(a.p[0] + a.radius, a.p[1] + a.radius, 0); }
    else if (a.type === 'shearPair') {
      pushP(a.p1[0], a.p1[1], a.h); pushP(a.p1[0], a.p1[1], 0);
      pushP(a.p2[0], a.p2[1], -a.h); pushP(a.p2[0], a.p2[1], 0);
    } else if (a.type === 'momentPair') {
      pushP(a.p1[0] - a.radius, a.p1[1] - a.radius, 0); pushP(a.p1[0] + a.radius, a.p1[1] + a.radius, 0);
      pushP(a.p2[0] - a.radius, a.p2[1] - a.radius, 0); pushP(a.p2[0] + a.radius, a.p2[1] + a.radius, 0);
    }
  });
  const pxMin = Math.min(...allPx), pxMax = Math.max(...allPx);
  const pyMin = Math.min(...allPy), pyMax = Math.max(...allPy);
  const pdx = (pxMax - pxMin) || 1, pdy = (pyMax - pyMin) || 1;
  const sc = Math.min((width - 2 * pad) / pdx, (height - 2 * pad) / pdy);
  const ccx = (pxMin + pxMax) / 2, ccy = (pyMin + pyMax) / 2;
  const ps = (x, y, z) => {
    const p = proj(x, y, z);
    return [width / 2 + view.zoom * sc * (p.px - ccx) + view.panX, height / 2 + view.zoom * sc * (p.py - ccy) + view.panY];
  };

  return (
    <svg ref={svgRef} width={width} height={height} viewBox={`0 0 ${width} ${height}`}
         onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}
         style={{background:'#f7f5ed', borderRadius:'4px', border:'1px solid #c9d6e3', cursor:'grab', userSelect:'none'}}>
      {elements.map((el, i) => {
        const n1 = nodeMap[el.n1], n2 = nodeMap[el.n2];
        if (!n1 || !n2) return null;
        const [x1, y1] = getXY(n1), [x2, y2] = getXY(n2);
        const [px1, py1] = ps(x1, y1, 0), [px2, py2] = ps(x2, y2, 0);
        return <line key={`e${i}`} x1={px1} y1={py1} x2={px2} y2={py2} stroke="#16243a" strokeWidth="1.5"/>;
      })}
      {nodes.map(node => {
        const sup = supMap[node.id];
        const [x, y] = getXY(node);
        const [px, py] = ps(x, y, 0);
        if (sup) {
          const isFullFixed = (sup.z && !removedSet.has(`${node.id}:z`)) &&
                              (sup.rx && !removedSet.has(`${node.id}:rx`)) &&
                              (sup.ry && !removedSet.has(`${node.id}:ry`));
          const anyRemoved = ['z','rx','ry'].some(d => sup[d] && removedSet.has(`${node.id}:${d}`));
          if (isFullFixed) {
            return (
              <g key={`n${node.id}`}>
                <rect x={px-7} y={py-7} width="14" height="14" fill="#e8edf4" stroke="#5a6b80" strokeWidth="1"/>
                <circle cx={px} cy={py} r="3" fill="#fff" stroke="#0891b2" strokeWidth="1"/>
                <text x={px+8} y={py-6} fontSize="7" fill="#0891b2" fontFamily="monospace" fontWeight="bold">{node.id}</text>
              </g>
            );
          }
          return (
            <g key={`n${node.id}`}>
              {anyRemoved && <circle cx={px} cy={py} r="9" fill="none" stroke="#e11d48" strokeWidth="1.2" strokeDasharray="2.5,1.5" opacity="0.8"/>}
              <circle cx={px} cy={py} r="5" fill="none" stroke="#5a6b80" strokeWidth="1"/>
              <circle cx={px} cy={py} r="3" fill="#fff" stroke="#0891b2" strokeWidth="1"/>
              <text x={px+7} y={py-5} fontSize="7" fill="#0891b2" fontFamily="monospace" fontWeight="bold">{node.id}</text>
            </g>
          );
        }
        return (
          <g key={`n${node.id}`}>
            <circle cx={px} cy={py} r="3" fill="#fff" stroke="#0891b2" strokeWidth="1"/>
            <text x={px+5} y={py-4} fontSize="7" fill="#0891b2" fontFamily="monospace" fontWeight="bold">{node.id}</text>
          </g>
        );
      })}
      {annotations.map(a => {
        if (a.type === 'forceUp') {
          const [bx, by] = ps(a.p[0], a.p[1], 0);
          const [tx, ty] = ps(a.p[0], a.p[1], a.h);
          return (
            <g key={`xi${a.i}`}>
              <line x1={bx} y1={by} x2={tx} y2={ty} stroke={a.color} strokeWidth="1.6"/>
              <path d={`M ${tx-3} ${ty+5} L ${tx} ${ty} L ${tx+3} ${ty+5}`} fill="none" stroke={a.color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
              <text x={tx+9} y={ty-4} fontSize="14" fill={a.color} fontFamily="monospace" fontWeight="bold">{a.xi}</text>
            </g>
          );
        }
        if (a.type === 'moment') {
          const [px, py] = ps(a.p[0], a.p[1], 0);
          const angle = -45;
          const r = a.radius * sc;
          return (
            <g key={`xi${a.i}`}>
              <MomentArrow x={px} y={py} radius={r} angle={angle} color={a.color} ccw={a.ccw}/>
              <text x={px + (r+11)*Math.sin(angle*Math.PI/180)} y={py - (r+11)*Math.cos(angle*Math.PI/180)} fontSize="14" fill={a.color} fontFamily="monospace" fontWeight="bold">{a.xi}</text>
            </g>
          );
        }
        if (a.type === 'shearPair') {
          const [b1x, b1y] = ps(a.p1[0], a.p1[1], 0);
          const [t1x, t1y] = ps(a.p1[0], a.p1[1], a.h);
          const [b2x, b2y] = ps(a.p2[0], a.p2[1], 0);
          const [t2x, t2y] = ps(a.p2[0], a.p2[1], -a.h);
          const midx = (b1x+b2x)/2, midy = (t1y+t2y)/2;
          return (
            <g key={`xi${a.i}`}>
              <line x1={b1x} y1={b1y} x2={t1x} y2={t1y} stroke={a.color} strokeWidth="1.6"/>
              <path d={`M ${t1x-3} ${t1y+5} L ${t1x} ${t1y} L ${t1x+3} ${t1y+5}`} fill="none" stroke={a.color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
              <line x1={b2x} y1={b2y} x2={t2x} y2={t2y} stroke={a.color} strokeWidth="1.6"/>
              <path d={`M ${t2x-3} ${t2y-5} L ${t2x} ${t2y} L ${t2x+3} ${t2y-5}`} fill="none" stroke={a.color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
              <text x={midx+9} y={midy} fontSize="14" fill={a.color} fontFamily="monospace" fontWeight="bold">{a.xi}</text>
            </g>
          );
        }
        // momentPair: para przeciwnych łuków po obu stronach rozcięcia (= para sił przy zwolnieniu Mg/Ms).
        const [p1x, p1y] = ps(a.p1[0], a.p1[1], 0);
        const [p2x, p2y] = ps(a.p2[0], a.p2[1], 0);
        const midx = (p1x+p2x)/2, midy = (p1y+p2y)/2;
        const rPair = a.radius * sc;
        return (
          <g key={`xi${a.i}`}>
            <MomentArrow x={p1x} y={p1y} radius={rPair} angle={-45} color={a.color} ccw={a.ccwFirst}/>
            <MomentArrow x={p2x} y={p2y} radius={rPair} angle={-45} color={a.color} ccw={!a.ccwFirst}/>
            <text x={midx+9} y={midy-7} fontSize="14" fill={a.color} fontFamily="monospace" fontWeight="bold">{a.xi}</text>
          </g>
        );
      })}
    </svg>
  );
}

const PRINT_VIEW = { zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: Math.PI/6 };
const noopSetView = () => {};

// Czysty, akademicki raport do druku (zob. App: osadzony w `hidden print:block`, na żywym
// interfejsie jest schowany przez `print:hidden`). Kolejność sekcji odwzorowuje ręczne
// rozwiązanie metodą sił: schemat -> stopień niewyznaczalności -> układ podstawowy ->
// stany 1/2/0 -> rozwinięte całki Wereszczagina (bez akordeonów) -> układ równań i wynik.
function PrintReport({nodes, elements, supports, staticInfo, basicSystemOptions, selectedOption, results, sym, statesData, ejGcRatio}) {
  const elementsFor = (stateIdx) => elements.map(el => ({...el, q: parseFloat(statesData[stateIdx]?.elementQ?.[el.id]) || 0}));
  const loadsFor = (stateIdx) => statesData[stateIdx]?.loads || [];
  const momentSufFor = (stateIdx) => computeSymSuffix(sym, 'M', stateIdx) || '';
  const deltas = results.deltas;
  const has2 = !!deltas?.has2;
  const basicCombo = (selectedOption !== null && basicSystemOptions[selectedOption]) ? basicSystemOptions[selectedOption] : null;

  const StateDiagrams = ({stateIdx, stateLabel, stateResult}) => !stateResult ? null : (
    <section className="print:break-inside-avoid mb-6">
      <h3 className="text-base font-bold mb-2 border-b border-slate-300 pb-1">{stateLabel}</h3>
      <div className="grid grid-cols-2 gap-4">
        <div>
          <div className="text-xs font-semibold mb-1 text-slate-600">Wykres Mz</div>
          <div className="aspect-[19/13] border border-slate-300">
            <StructureView nodes={nodes} elements={elementsFor(stateIdx)} supports={supports} loads={loadsFor(stateIdx)}
              results={{elementForces: stateResult.elementForces}} viewMode="mz" view={PRINT_VIEW} setView={noopSetView}
              momentSuffix={momentSufFor(stateIdx)}/>
          </div>
        </div>
        <div>
          <div className="text-xs font-semibold mb-1 text-slate-600">Wykres Ms</div>
          <div className="aspect-[19/13] border border-slate-300">
            <StructureView nodes={nodes} elements={elementsFor(stateIdx)} supports={supports} loads={loadsFor(stateIdx)}
              results={{elementForces: stateResult.elementForces}} viewMode="ms" view={PRINT_VIEW} setView={noopSetView}
              momentSuffix={momentSufFor(stateIdx)}/>
          </div>
        </div>
      </div>
    </section>
  );

  return (
    <div className="max-w-[190mm] mx-auto p-6 font-sans text-slate-100">
      <h1 className="text-xl font-bold mb-1">Raport obliczeń — Solver Rusztów MES</h1>
      <p className="text-xs text-slate-500 mb-6">Metoda sił — rozwiązanie krok po kroku · {new Date().toLocaleDateString('pl-PL')}</p>

      <section className="print:break-inside-avoid mb-6">
        <h2 className="text-lg font-bold mb-2 border-b border-slate-300 pb-1">1. Schemat ogólny</h2>
        <div className="text-sm mb-2 space-y-0.5">
          <div>EJ/GC = {fmt(ejGcRatio, 2)}</div>
          {loadsFor(0).filter(l => Math.abs(parseFloat(l.Fz)||0)+Math.abs(parseFloat(l.Mx)||0)+Math.abs(parseFloat(l.My)||0) > 1e-9).map((l,i) => (
            <div key={i}>Obciążenie w węźle {l.node}: Fz={fmt(parseFloat(l.Fz)||0,2)}, Mx={fmt(parseFloat(l.Mx)||0,2)}, My={fmt(parseFloat(l.My)||0,2)}</div>
          ))}
          {elementsFor(0).filter(el => Math.abs(el.q) > 1e-9).map((el,i) => (
            <div key={i}>Obciążenie ciągłe na pręcie {el.id}: q={fmt(el.q,2)}</div>
          ))}
        </div>
        <div className="aspect-[19/13] border border-slate-300" style={{maxWidth: '500px'}}>
          <StructureView nodes={nodes} elements={elementsFor(0)} supports={supports} loads={loadsFor(0)}
            results={null} viewMode="structure" view={PRINT_VIEW} setView={noopSetView} momentSuffix=""/>
        </div>
      </section>

      {staticInfo && (() => {
        // Do Etapu 3 `supports`/`elements` w App są już ZMODYFIKOWANE do wybranego układu
        // podstawowego (goToStage3 usuwa więzy / dodaje przeguby), więc `staticInfo` liczone na
        // bieżącym modelu opisuje już zredukowany (statycznie wyznaczalny) układ, nie oryginalny
        // problem użytkownika. Odtwarzamy oryginalny stopień niewyznaczalności z `basicCombo`:
        // każde zwolnione więzy podporowe zwiększa r, każdy dodany przegub wewnętrzny zmniejsza h.
        const numRemoved = basicCombo ? basicCombo.removed.length : 0;
        const numRemovedInternal = basicCombo ? basicCombo.removed.filter(rc => rc.kind === 'internal').length : 0;
        const numRemovedSupport = numRemoved - numRemovedInternal;
        const origR = staticInfo.r + numRemovedSupport;
        const origH = staticInfo.h - numRemovedInternal;
        const origN = staticInfo.n + numRemoved;
        return (
          <section className="print:break-inside-avoid mb-6">
            <h2 className="text-lg font-bold mb-2 border-b border-slate-300 pb-1">2. Stopień statycznej niewyznaczalności</h2>
            <p className="text-sm font-mono">
              n = 3·m + r − 3·w − h = 3·{staticInfo.m} + {origR} − 3·{staticInfo.w}{origH ? ` − ${origH}` : ''} = {origN}
            </p>
            <p className="text-sm mt-1">
              {origN === 0 ? 'Układ statycznie wyznaczalny.' : `Układ ${origN}-krotnie statycznie niewyznaczalny — metoda sił wymaga ${origN} równań kanonicznych.`}
            </p>
          </section>
        );
      })()}

      {basicCombo && (
        <section className="print:break-inside-avoid mb-6">
          <h2 className="text-lg font-bold mb-2 border-b border-slate-300 pb-1">3. Układ podstawowy</h2>
          <ul className="text-sm mb-2 list-disc pl-5">
            {basicCombo.removed.map((rc,i) => <li key={i}>{rc.xi} = {rc.constraint}</li>)}
          </ul>
          <div style={{maxWidth:'500px'}}>
            <MiniBasicSystem nodes={nodes} elements={elements} supports={supports} removedConstraints={basicCombo.removed} width={460} height={360}/>
          </div>
        </section>
      )}

      <StateDiagrams stateIdx={1} stateLabel="4. Stan 1 (X₁ = 1)" stateResult={results.state1}/>
      {has2 && <StateDiagrams stateIdx={2} stateLabel="5. Stan 2 (X₂ = 1)" stateResult={results.state2}/>}
      <StateDiagrams stateIdx={0} stateLabel={`${has2 ? '6' : '5'}. Stan 0 (obciążenia rzeczywiste)`} stateResult={results.state0}/>

      {deltas && (
        <section className="mb-6">
          <h2 className="text-lg font-bold mb-2 border-b border-slate-300 pb-1">{has2 ? '7' : '6'}. Obliczenia całek Wereszczagina</h2>
          <div className="space-y-3">
            <WereshchaginPanel deltas={deltas} pairKey="11" label="Rozkład per pręt: δ11" sym={sym}/>
            {has2 && <WereshchaginPanel deltas={deltas} pairKey="22" label="Rozkład per pręt: δ22" sym={sym}/>}
            {has2 && <WereshchaginPanel deltas={deltas} pairKey="12" label="Rozkład per pręt: δ12" sym={sym}/>}
            <WereshchaginPanel deltas={deltas} pairKey="10" label="Rozkład per pręt: δ10" sym={sym}/>
            {has2 && <WereshchaginPanel deltas={deltas} pairKey="20" label="Rozkład per pręt: δ20" sym={sym}/>}
            <WereshchaginPanel deltas={deltas} pairKey="00" label="Rozkład per pręt: δ00 (kontrola)" sym={sym}/>
          </div>
        </section>
      )}

      {deltas && (
        <section className="print:break-inside-avoid mb-6">
          <h2 className="text-lg font-bold mb-2 border-b border-slate-300 pb-1">{has2 ? '8' : '7'}. Układ równań i wyniki</h2>
          {has2 ? (
            <div className="space-y-2 text-sm font-mono">
              <div className="grid grid-cols-3 gap-3">
                <div><span className="text-slate-500">δ11</span> = {computeSymFmt(sym, deltas.delta11, 'd_self', 4, 1)}</div>
                <div><span className="text-slate-500">δ12 = δ21</span> = {computeSymFmt(sym, deltas.delta12, 'd_cross', 4, 1, 2)}</div>
                <div><span className="text-slate-500">δ22</span> = {computeSymFmt(sym, deltas.delta22, 'd_self', 4, 2)}</div>
                <div><span className="text-slate-500">δ10</span> = {computeSymFmt(sym, deltas.delta10, 'd_cross', 4, 1, 0)}</div>
                <div><span className="text-slate-500">δ20</span> = {computeSymFmt(sym, deltas.delta20, 'd_cross', 4, 2, 0)}</div>
                <div><span className="text-slate-500">δ00 (kontrola)</span> = {fmt(deltas.delta00, 4)}</div>
              </div>
              <div>[δ11 δ12; δ12 δ22]·[X1; X2] = −[δ10; δ20]</div>
              <div className="font-bold text-base">X1 = {computeSymFmt(sym, deltas.X1, 'X', 4, 1)}</div>
              <div className="font-bold text-base">X2 = {computeSymFmt(sym, deltas.X2, 'X', 4, 2)}</div>
              <div className="mt-1">Wykres końcowy: M = M0 + X1·M1 + X2·M2</div>
            </div>
          ) : (
            <div className="space-y-2 text-sm font-mono">
              <div><span className="text-slate-500">δ11</span> = {computeSymFmt(sym, deltas.delta11, 'd_self', 4, 1)}</div>
              <div><span className="text-slate-500">δ10</span> = {computeSymFmt(sym, deltas.delta10, 'd_cross', 4, 1, 0)}</div>
              <div><span className="text-slate-500">δ00 (kontrola)</span> = {fmt(deltas.delta00, 4)}</div>
              <div>X1 = −δ10 / δ11 = <span className="font-bold text-base">{computeSymFmt(sym, deltas.X1, 'X', 4, 1)}</span></div>
              <div className="mt-1">Wykres końcowy: M = M0 + X1·M1</div>
            </div>
          )}
        </section>
      )}
    </div>
  );
}

function App() {
  const [nodes, setNodes] = useState(EXAMPLES.zadanie.nodes);
  const [elements, setElements] = useState(EXAMPLES.zadanie.elements.map(el => { const {q, ...rest} = el; return rest; }));
  const [supports, setSupports] = useState(EXAMPLES.zadanie.supports);
  const [activeState, setActiveState] = useState(0);
  const [statesData, setStatesData] = useState(() => {
    const exQ = {};
    EXAMPLES.zadanie.elements.forEach(el => { if (el.q) exQ[el.id] = parseFloat(el.q) || 0; });
    return [
      {loads: EXAMPLES.zadanie.loads.map(l => ({...l})), elementQ: exQ},
      {loads: [], elementQ: {}},
      {loads: [], elementQ: {}}
    ];
  });
  const loads = statesData[activeState].loads;
  const setLoads = (val) => setStatesData(prev => prev.map((s,i) => i===activeState ? {...s, loads: typeof val==='function' ? val(s.loads) : val} : s));
  const getQ = (id) => parseFloat(statesData[activeState].elementQ[id]) || 0;
  const setQ = (id, val) => setStatesData(prev => prev.map((s,i) => i===activeState ? {...s, elementQ: {...s.elementQ, [id]: val}} : s));
  const [activeTab, setActiveTab] = useState('nodes');
  const [resultsTab, setResultsTab] = useState('forces');
  const [viewMode, setViewMode] = useState('structure');
  const DEFAULT_VIEW = { zoom: 1, panX: 0, panY: 0, yaw: 0, pitch: Math.PI/6 };
  const [view, setView] = useState(DEFAULT_VIEW);
  const resetView = () => setView({...DEFAULT_VIEW});
  const [results, setResults] = useState(null);
  const [error, setError] = useState(null);
  const [showHelp, setShowHelp] = useState(false);
  const [wereszczaginShow, setWereszczaginShow] = useState(null); // null | '00' | '11' | '10'
  const [symbolic, setSymbolic] = useState({enabled: false});
  // Globalna proporcja EJ/GC stosowana do wszystkich prętów. Domyślnie 1.3 (typowe dla rusztu stalowego)
  const [ejGcRatio, setEjGcRatioState] = useState(() => {
    const initEls = EXAMPLES.zadanie.elements;
    if (!initEls.length) return 1.3;
    const ei = parseFloat(initEls[0].EI) || 1;
    const gj = parseFloat(initEls[0].GJ) || 1;
    return ei / gj;
  });
  // Zmiana ratio nadpisuje GJ na wszystkich prętach: GJ_new = EI / ratio (zachowuje EI)
  const updateEjGcRatio = (val) => {
    const r = parseFloat(val);
    if (!Number.isFinite(r) || r <= 0) return;
    setEjGcRatioState(r);
    setElements(prev => prev.map(el => ({
      ...el,
      GJ: ((parseFloat(el.EI) || 1) / r).toFixed(4)*1
    })));
  };
  // Auto-wykryte typy obciążeń per stan: ['P'|'q'|'mixed'|'none', 'force'|'moment'|'mixed'|'none', ...]
  const stateTypes = useMemo(() =>
    statesData.map((s, i) => detectStateType(s, elements, i === 0)),
    [statesData, elements]
  );
  // Wzbogacony obiekt symboliki przekazywany do helperów i komponentów
  const sym = useMemo(() => ({enabled: symbolic.enabled, types: stateTypes}),
    [symbolic.enabled, stateTypes]);

  const staticInfo = useMemo(() => computeStaticDegree(nodes, elements, supports), [nodes, elements, supports]);
  const basicSystem = useMemo(() => staticInfo ? proposeBasicSystem(supports, staticInfo.n) : [], [supports, staticInfo]);
  const allCandidates = useMemo(() =>
    [...getAllConstraints(supports), ...getInternalReleaseCandidates(nodes, elements)],
    [supports, nodes, elements]
  );

  // Przepływ etapowy
  const [appStage, setAppStage] = useState(1);
  const [basicSystemOptions, setBSOptions] = useState([]);
  const [bsTotalChecked, setBsTotalChecked] = useState(0);
  const [selectedOption, setSelectedOption] = useState(null);
  const [manualMode, setManualMode] = useState(false);
  const [manualSelection, setManualSelection] = useState([]);
  const manualSystemStatus = useMemo(() => {
    if (!manualMode || !staticInfo || manualSelection.length !== staticInfo.n) return null;
    const {supports: tempS, elements: tempE} = applyComboToModel(supports, elements, manualSelection);
    return isGeometricallyStable(tempS, nodes, tempE) ? 'stable' : 'unstable';
  }, [manualMode, manualSelection, staticInfo, supports, elements, nodes]);

  // Wiersze podpór wymuszone na "Własna" (checkboxy), nawet gdy aktualna kombinacja
  // z/rx/ry pasuje akurat do jednego z presetów — inaczej kontrolowany <select> wracałby
  // od razu do dopasowanego presetu i "Własna" byłaby nieosiągalna.
  const [forceCustomSupport, setForceCustomSupport] = useState({});

  // Wybór jednostek symbolicznych dla różnych typów wyników
  // Sufiks symboliczny dla wartości danego typu (kind) w danym stanie (stateIdx).
  // Dla par (d_cross) potrzebny też stateIdx2.
  const symSuffix = (kind, stateIdx, stateIdx2) =>
    computeSymSuffix(sym, kind, (stateIdx === undefined || stateIdx === null) ? activeState : stateIdx, stateIdx2);
  const symFmt = (val, kind, decimals=2, stateIdx, stateIdx2) =>
    computeSymFmt(sym, val, kind, decimals, (stateIdx === undefined || stateIdx === null) ? activeState : stateIdx, stateIdx2);

  const calculate = useCallback(() => {
    try {
      setError(null);
      const res = computeAll(nodes, elements, supports, statesData);
      setResults(res); setViewMode('mz');
    } catch (e) { setError(e.message); setResults(null); }
  }, [nodes, elements, supports, statesData]);

  const goToStage2 = useCallback(() => {
    setError(null);
    if (!nodes.length || !elements.length) { setError('Dodaj węzły i pręty przed przejściem dalej.'); return; }
    const info = computeStaticDegree(nodes, elements, supports);
    if (!info) { setError('Nie można obliczyć stopnia niewyznaczalności.'); return; }
    if (info.n < 0) { setError(`Układ geometrycznie zmienny (n = ${info.n}). Sprawdź geometrię i podpory.`); return; }
    if (info.n === 0) {
      try {
        const res = computeAll(nodes, elements, supports, statesData);
        setResults(res); setViewMode('mz'); setAppStage(3);
      } catch (e) { setError(e.message); }
      return;
    }
    const {valid, total} = enumerateBasicSystems(supports, nodes, elements, info.n);
    if (valid.length === 0) {
      setError(`Brak geometrycznie niezmiennych układów podstawowych (sprawdzono ${total} kombinacji, w tym rozcięcia wewnętrzne). Sprawdź podpory i przeguby.`);
      return;
    }
    setBSOptions(valid); setBsTotalChecked(total); setSelectedOption(0); setManualMode(false); setManualSelection([]); setAppStage(2);
  }, [nodes, elements, supports, statesData]);

  const goToStage3 = useCallback(() => {
    setError(null);
    let comboRemoved;
    if (manualMode) {
      if (!staticInfo || manualSelection.length !== staticInfo.n) {
        setError(`Zaznacz dokładnie ${staticInfo?.n ?? '?'} więz${staticInfo?.n === 1 ? '' : staticInfo?.n < 5 ? 'y' : 'ów'} do zwolnienia.`);
        return;
      }
      if (manualSystemStatus !== 'stable') {
        setError('Wybrany układ jest chwiejny (mechanizm). Zmień wybór zwolnień.');
        return;
      }
      comboRemoved = manualSelection.map((rc, i) => ({
        ...rc,
        xi: 'X' + (XI_SUB[i] || (i + 1)),
        stateIdx: i + 1,
      }));
    } else {
      if (selectedOption === null || !basicSystemOptions[selectedOption]) return;
      comboRemoved = basicSystemOptions[selectedOption].removed;
    }
    const newSupports = supports.map(s => ({...s}));
    const newElements = elements.map(el => ({
      ...el,
      release1: el.release1 ? {...el.release1} : undefined,
      release2: el.release2 ? {...el.release2} : undefined,
    }));
    comboRemoved.forEach(rc => {
      if (rc.kind === 'internal') {
        const el = newElements.find(e => e.id === rc.elementId);
        if (!el) return;
        const cur = el[rc.relKey] || {mg:false, ms:false, v:false};
        el[rc.relKey] = {...cur, [rc.relType]: true};
      } else {
        const idx = newSupports.findIndex(s => s.node === rc.node);
        if (idx !== -1) newSupports[idx] = {...newSupports[idx], [rc.dof]: false};
      }
    });
    const filteredSupports = newSupports.filter(s => s.z || s.rx || s.ry);
    const newStatesData = statesData.map((s, i) => {
      if (i === 0) return s;
      const rc = comboRemoved[i - 1];
      if (!rc) return {loads: [], elementQ: {}, internalUnitLoad: null};
      if (rc.kind === 'internal') {
        return {
          loads: [], elementQ: {},
          internalUnitLoad: {elementId: rc.elementId, relKey: rc.relKey, relType: rc.relType},
        };
      }
      return {
        loads: [{node: rc.node, Fz: rc.dof==='z'?1:0, Mx: rc.dof==='rx'?1:0, My: rc.dof==='ry'?1:0}],
        elementQ: {}, internalUnitLoad: null,
      };
    });
    setSupports(filteredSupports);
    setElements(newElements);
    setStatesData(newStatesData);
    try {
      const res = computeAll(nodes, newElements, filteredSupports, newStatesData);
      setResults(res); setViewMode('mz'); setAppStage(3);
    } catch (e) { setError(e.message); setResults(null); }
  }, [manualMode, manualSelection, manualSystemStatus, staticInfo, selectedOption, basicSystemOptions, supports, statesData, nodes, elements]);

  const handlePrimaryAction = () => {
    if (appStage === 1) goToStage2();
    else if (appStage === 2) goToStage3();
    else calculate();
  };

  const handleAutoFill = useCallback(() => {
    // 1. Zwolnij WSZYSTKIE n więzów w podporach (układ podstawowy)
    setSupports(prev => {
      const updated = prev.map(sup => ({...sup}));
      basicSystem.forEach(rel => {
        const idx = updated.findIndex(s => s.node === rel.node);
        if (idx !== -1) updated[idx] = {...updated[idx], [rel.dof]: false};
      });
      return updated.filter(s => s.z || s.rx || s.ry);
    });
    // 2. Wpisz obciążenia jednostkowe do Stan 1 i Stan 2 (limit interfejsu: max 2)
    setStatesData(prev => prev.map((s, i) => {
      if (i === 0 || !basicSystem[i - 1]) return s;
      const rel = basicSystem[i - 1];
      return {
        loads: [{ node: rel.node, Fz: rel.dof === 'z' ? 1 : 0, Mx: rel.dof === 'rx' ? 1 : 0, My: rel.dof === 'ry' ? 1 : 0 }],
        elementQ: {}
      };
    }));
    setActiveState(1);
  }, [basicSystem]);

  const loadExample = (key) => {
    const ex = EXAMPLES[key];
    setNodes(ex.nodes.map(n => ({...n})));
    setElements(ex.elements.map(el => { const {q, ...rest} = el; return {...rest}; }));
    setSupports(ex.supports.map(s => ({...s})));
    const exQ = {};
    ex.elements.forEach(el => { if (el.q) exQ[el.id] = parseFloat(el.q) || 0; });
    setStatesData([
      {loads: ex.loads.map(l => ({...l})), elementQ: exQ},
      {loads: [], elementQ: {}},
      {loads: [], elementQ: {}}
    ]);
    // Wyciągnij EJ/GC z pierwszego pręta przykładu
    const firstEl = ex.elements[0];
    if (firstEl) {

      setEjGcRatioState(ei / gj);

    setActiveState(0); setAppStage(1); setBSOptions([]); setBsTotalChecked(0); setSelectedOption(null); setManualMode(false); setManualSelection([]);

  };
  const reset = () => { setNodes([]); setElements([]); setSupports([]); setStatesData([{loads:[], elementQ:{}}, {loads:[], elementQ:{}}, {loads:[], elementQ:{}}]); setActiveState(0); setResults(null); setError(null); setViewMode('structure'); resetView(); setAppStage(1); setBSOptions([]); setBsTotalChecked(0); setSelectedOption(null); setManualMode(false); setManualSelection([]); };
  const addNode = () => { setNodes([...nodes, {id: String.fromCharCode(65+nodes.length), x:0, y:0}]); };
  const updateNode = (i,k,v) => { const n=[...nodes]; n[i]={...n[i],[k]:v}; setNodes(n); };

  const tableResults = results ? (activeState === 2 ? results.state2 : activeState === 1 ? results.state1 : results.state0) : null;

            const gj = parseFloat(cleanEls[0].GJ) || 1;

          setError(null);
          setViewMode('structure');
        } catch (err) {
          alert('Nieprawidłowy plik: ' + err.message);
        }

      reader.onerror = () => alert('Błąd odczytu pliku');
      reader.readAsText(file);
    };
    input.click();
  };

  return (
    <div className="min-h-screen text-slate-100" style={{fontFamily:'ui-sans-serif, system-ui, sans-serif'}}>
    <div className="print:hidden">
      <header className="border-b border-slate-800 bg-white sticky top-0 z-10 no-print">

            </div>
            <div>
              <h1 className="text-base font-semibold tracking-tight">Solver Rusztów <span className="text-cyan-400">MES</span></h1>
              <p className="text-[10px] text-slate-500 uppercase tracking-widest">offline / standalone</p>
            </div>
          </div>
          <Stepper stage={appStage} onBack={setAppStage}/>
          <div className="flex items-center gap-2 flex-wrap">
            <select onChange={e => e.target.value && loadExample(e.target.value)} value="" className="bg-slate-800 border border-slate-700 text-xs px-3 py-1.5 rounded text-slate-300 focus:outline-none focus:border-cyan-500">
              <option value="">Wczytaj przykład…</option>
              {Object.entries(EXAMPLES).map(([key, ex]) => <option key={key} value={key}>{ex.name}</option>)}
            </select>
            <button onClick={() => setShowHelp(!showHelp)} className="text-xs px-3 py-1.5 rounded text-slate-400 hover:text-slate-200 hover:bg-slate-800 flex items-center gap-1.5"><Info size={14}/> Pomoc</button>
            <button onClick={importSchema} className="text-xs px-3 py-1.5 rounded text-slate-300 hover:text-cyan-300 hover:bg-cyan-950/30 flex items-center gap-1.5 border border-slate-700"><FolderOpen size={14}/> Wczytaj</button>
            <button onClick={exportSchema} className="text-xs px-3 py-1.5 rounded text-slate-300 hover:text-cyan-300 hover:bg-cyan-950/30 flex items-center gap-1.5 border border-slate-700"><Save size={14}/> Zapisz</button>
            <button onClick={reset} className="text-xs px-3 py-1.5 rounded text-slate-400 hover:text-rose-400 hover:bg-rose-950/40 flex items-center gap-1.5"><RotateCcw size={14}/> Reset</button>
            {results && <button onClick={handlePrint} className="text-xs px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800 flex items-center gap-1.5 border border-slate-700"><Printer size={14}/> Drukuj</button>}
            <button onClick={handlePrimaryAction} className="text-xs px-4 py-1.5 rounded bg-cyan-500 text-slate-100 font-semibold hover:bg-cyan-400 flex items-center gap-1.5 shadow-lg shadow-cyan-500/20">
              <Play size={14} fill="currentColor"/>
              {appStage === 1 ? 'Oblicz / Dalej' : appStage === 2 ? 'Oblicz / Dalej' : 'Oblicz ponownie'}
            </button>
          </div>
        </div>
      </header>

      {showHelp && <div className="bg-white border-b border-slate-800 no-print"><div className="max-w-7xl mx-auto px-6 py-4 text-sm text-slate-300 space-y-2">
        <p><span className="text-cyan-400 font-semibold">Konwencja:</span> ruszt w płaszczyźnie xy, z prostopadle.</p>
        <p><span className="text-cyan-400 font-semibold">DOF:</span> w (z), θx, θy. Utwierdzenie = wszystkie 3, podpora przegubowa = tylko z.</p>
        <p><span className="text-cyan-400 font-semibold">Obciążenia:</span> Fz ujemne = w dół (siła węzłowa). q ciągłe na pręcie – kolumna <code className="text-amber-400">q</code> w tabeli prętów (ujemna = w dół).</p>
        <p><span className="text-cyan-400 font-semibold">Stany (metoda sił):</span> przełącznik <strong>Stan 0 / Stan 1 / Stan 2</strong> nad tabelami. Stan 0 = obciążenia rzeczywiste; Stan 1 = X₁=1, Stan 2 = X₂=1 (jeśli układ 2× niewyznaczalny). Aplikacja liczy δᵢⱼ (Wereszczagin), rozwiązuje układ na X₁ (i X₂) i tworzy wykres końcowy M = M₀ + X₁·M₁ (+ X₂·M₂). Stan 2 możesz zostawić pusty dla zwykłej 1× niewyznaczalności.</p>
        <p><span className="text-cyan-400 font-semibold">Wyniki symboliczne:</span> włącz w pasku nad wynikami. Aplikacja <strong>automatycznie wykrywa</strong> typ obciążenia każdego stanu na podstawie tego co wpiszesz: Stan 0 z <code className="text-amber-400">Fz</code> → suffix <em>P</em>, z <code className="text-amber-400">q</code> na pręcie → <em>q</em>; Stan 1/2 z <code className="text-amber-400">Fz=1</code> → siła jednostkowa (suffix <em>L</em>), z <code className="text-amber-400">Mx/My=1</code> → moment jednostkowy (bez suffixu). <strong>Wpisuj dane znormalizowane (L=1, P=1 lub q=1, EJ=1)</strong> — wartości w wynikach to bezpośrednio współczynniki, np. <em>5.5 PL</em>, <em>0.083 qL⁴/EJ</em>, <em>16 L</em> dla X₁ siła.</p>
        <p><span className="text-cyan-400 font-semibold">Wykresy:</span> Mz – paraboliczny gdy q≠0 (z ekstremum w środku przedziału), liniowy dla obciążeń węzłowych. Ms = stała wzdłuż pręta.</p>
      </div></div>}

      <div className="max-w-7xl mx-auto px-6 pt-4 no-print">

          <span className="text-[10px] uppercase tracking-wider text-slate-500">Wyświetlanie:</span>
          <label className="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" className={checkCell} checked={symbolic.enabled} onChange={e => setSymbolic({...symbolic, enabled: e.target.checked})}/>
            <span className="text-slate-300">Tryb symboliczny</span>
          </label>
          <div className="w-px h-5 bg-slate-800"></div>
          <div className="flex items-center gap-1.5">
            <span className="text-xs text-amber-300 font-mono">EJ/GC =</span>
            <input
              type="number" step="0.05" min="0.1"
