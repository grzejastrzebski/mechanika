              title="Globalna proporcja EJ/GC stosowana do wszystkich prętów"
            />
            <button onClick={() => updateEjGcRatio(1.0)} className={`text-[10px] px-1.5 py-0.5 rounded ${Math.abs(ejGcRatio-1.0)<1e-3?'bg-amber-500/20 text-amber-200 ring-1 ring-amber-500/40':'text-slate-400 hover:bg-slate-800'}`}>1.0</button>
            <button onClick={() => updateEjGcRatio(1.3)} className={`text-[10px] px-1.5 py-0.5 rounded ${Math.abs(ejGcRatio-1.3)<1e-3?'bg-amber-500/20 text-amber-200 ring-1 ring-amber-500/40':'text-slate-400 hover:bg-slate-800'}`}>1.3</button>
            <button onClick={() => updateEjGcRatio(1.5)} className={`text-[10px] px-1.5 py-0.5 rounded ${Math.abs(ejGcRatio-1.5)<1e-3?'bg-amber-500/20 text-amber-200 ring-1 ring-amber-500/40':'text-slate-400 hover:bg-slate-800'}`}>1.5</button>

            <button onClick={()=>setViewMode('ms3d')} disabled={!results} className={`px-3 py-2.5 text-xs font-medium tracking-wide uppercase transition-colors flex items-center gap-1.5 border-b-2 ${viewMode==='ms3d'?'text-orange-300 border-orange-400':'text-slate-500 border-transparent hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed'}`}><Activity size={12}/> Ms 3D</button>
            <div className="w-px h-6 bg-slate-800 mx-1"></div>
            <button onClick={()=>setViewMode('mzFinal')} disabled={!results || !results.finalForces} className={`px-3 py-2.5 text-xs font-medium tracking-wide uppercase transition-colors flex items-center gap-1.5 border-b-2 ${viewMode==='mzFinal'?'text-emerald-300 border-emerald-400':'text-slate-500 border-transparent hover:text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed'}`} title="M = M₀ + X₁·M₁ (+ X₂·M₂)"><BarChart3 size={12}/> Mz końcowy</button>
            <div className="flex-1"></div>
            <button onClick={resetView} title="Reset zoom/pan/obrotu" className="text-[10px] uppercase tracking-wider text-slate-500 hover:text-cyan-300 px-3 py-1 rounded hover:bg-slate-800/60 mr-2">⟲ Reset widoku</button>
            {!results && <span className="text-[10px] text-slate-600 px-3">Naciśnij Oblicz</span>}
          </div>
          <div className="aspect-[19/13] bg-slate-950">
            <StructureView nodes={nodes} elements={elementsForView} supports={supports} loads={loads} results={displayResults} viewMode={viewMode==='mzFinal'?'mz':(viewMode==='msFinal'?'ms':viewMode)} view={view} setView={setView} momentSuffix={symSuffix('M', (viewMode==='mzFinal'||viewMode==='msFinal') ? 0 : activeState)}/>
          </div>
        </div>
        )}
      </div>

      {error && <div className="max-w-7xl mx-auto px-6 no-print"><div className="bg-rose-950 border border-rose-900 rounded-lg px-4 py-3 text-sm text-rose-200">{error}</div></div>}

      {appStage === 3 && results && <div className="max-w-7xl mx-auto px-6 pb-10 space-y-4">

        {results.deltas && <div className="bg-emerald-950 border border-emerald-800/50 rounded-lg p-4">
          <div className="text-xs uppercase tracking-wider text-emerald-300 mb-3 font-semibold flex items-center gap-3 flex-wrap">
            <span>Wereszczagin · Metoda sił {results.deltas.has2 && <span className="text-[10px] normal-case tracking-normal text-emerald-400/70">(układ 2× niewyznaczalny)</span>}</span>
            <span className="bg-amber-950/40 border border-amber-700/40 rounded px-2 py-0.5 normal-case tracking-normal text-amber-200 font-mono text-xs">EJ/GC = {fmt(ejGcRatio, 2)}</span>
          </div>
          {results.deltas.has2 ? (
            <div className="space-y-3">
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-sm font-mono">
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₁₁</div><div className="text-emerald-300">{symFmt(results.deltas.delta11, 'd_self', 4, 1)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₁₂ = δ₂₁</div><div className="text-emerald-300">{symFmt(results.deltas.delta12, 'd_cross', 4, 1, 2)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₂₂</div><div className="text-emerald-300">{symFmt(results.deltas.delta22, 'd_self', 4, 2)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₁₀</div><div className="text-emerald-300">{symFmt(results.deltas.delta10, 'd_cross', 4, 1, 0)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₂₀</div><div className="text-emerald-300">{symFmt(results.deltas.delta20, 'd_cross', 4, 2, 0)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₀₀ (kontrola)</div><div className="text-slate-400">{fmt(results.deltas.delta00, 4)}</div></div>
              </div>
              <div className="grid grid-cols-2 gap-3 text-sm font-mono">
                <div className="bg-emerald-900/30 rounded px-3 py-2 ring-1 ring-emerald-700/40"><div className="text-[10px] text-emerald-400">X₁ (z układu 2×2)</div><div className="text-emerald-200 font-bold">{symFmt(results.deltas.X1, 'X', 4, 1)}</div></div>
                <div className="bg-emerald-900/30 rounded px-3 py-2 ring-1 ring-emerald-700/40"><div className="text-[10px] text-emerald-400">X₂ (z układu 2×2)</div><div className="text-emerald-200 font-bold">{symFmt(results.deltas.X2, 'X', 4, 2)}</div></div>
              </div>
              <div className="text-[11px] text-slate-400 font-mono pt-1">
                <div>[δ₁₁ δ₁₂; δ₁₂ δ₂₂]·[X₁; X₂] = −[δ₁₀; δ₂₀]</div>
                <div className="mt-1">Wykres końcowy: M = M₀ + X₁·M₁ + X₂·M₂ — kliknij "Mz końcowy"</div>
              </div>
            </div>
          ) : (
            <>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm font-mono">
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₁₁</div><div className="text-emerald-300">{symFmt(results.deltas.delta11, 'd_self', 4, 1)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₁₀</div><div className="text-emerald-300">{symFmt(results.deltas.delta10, 'd_cross', 4, 1, 0)}</div></div>
                <div className="bg-slate-950/50 rounded px-3 py-2"><div className="text-[10px] text-slate-500">δ₀₀ (kontrola)</div><div className="text-slate-400">{fmt(results.deltas.delta00, 4)}</div></div>
                <div className="bg-emerald-900/30 rounded px-3 py-2 ring-1 ring-emerald-700/40"><div className="text-[10px] text-emerald-400">X₁ = −δ₁₀ / δ₁₁</div><div className="text-emerald-200 font-bold">{symFmt(results.deltas.X1, 'X', 4, 1)}</div></div>
              </div>
              <div className="mt-3 text-[11px] text-slate-400">Wykres końcowy: M = M₀ + X₁·M₁ — kliknij "Mz końcowy" w widoku</div>
            </>
          )}
          <div className="mt-3 flex flex-wrap items-center gap-2 no-print">
            <span className="text-[10px] uppercase tracking-wider text-slate-500">Rozkład Wereszczagina:</span>
            <button onClick={()=>setWereszczaginShow(wereszczaginShow==='11'?null:'11')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='11'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='11'?'▼':'▶'} δ₁₁</button>
            {results.deltas.has2 && <button onClick={()=>setWereszczaginShow(wereszczaginShow==='22'?null:'22')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='22'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='22'?'▼':'▶'} δ₂₂</button>}
            {results.deltas.has2 && <button onClick={()=>setWereszczaginShow(wereszczaginShow==='12'?null:'12')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='12'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='12'?'▼':'▶'} δ₁₂</button>}
            <button onClick={()=>setWereszczaginShow(wereszczaginShow==='10'?null:'10')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='10'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='10'?'▼':'▶'} δ₁₀</button>
            {results.deltas.has2 && <button onClick={()=>setWereszczaginShow(wereszczaginShow==='20'?null:'20')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='20'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='20'?'▼':'▶'} δ₂₀</button>}
            <button onClick={()=>setWereszczaginShow(wereszczaginShow==='00'?null:'00')} className={`px-3 py-1 text-xs rounded ${wereszczaginShow==='00'?'bg-emerald-500/30 text-emerald-200 ring-1 ring-emerald-500':'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>{wereszczaginShow==='00'?'▼':'▶'} δ₀₀</button>
          </div>
          {wereszczaginShow && <WereshchaginPanel deltas={results.deltas} pairKey={wereszczaginShow} label={`Rozkład per pręt: δ${wereszczaginShow.split('').map(c => c==='0'?'₀':c==='1'?'₁':'₂').join('')}`} sym={sym}/>}
        </div>}

        <div className="bg-white border border-slate-800 rounded-lg overflow-hidden">
          <div className="border-b border-slate-800 flex items-center bg-white no-print">
            <button className={tabBtn(resultsTab==='forces')} onClick={()=>setResultsTab('forces')}>Siły wewnętrzne</button>
            <button className={tabBtn(resultsTab==='reactions')} onClick={()=>setResultsTab('reactions')}>Reakcje</button>
            <button className={tabBtn(resultsTab==='displacements')} onClick={()=>setResultsTab('displacements')}>Przemieszczenia</button>
            <div className="flex-1"></div>
            <span className="text-[10px] uppercase tracking-wider text-slate-500 px-3">{activeState===0?'Stan 0':'Stan 1'}</span>
          </div>
          <div className="p-4 overflow-x-auto">
            {tableResults && resultsTab==='forces' && <table className="w-full text-sm font-mono"><thead className="text-[10px] uppercase text-slate-500 tracking-wider"><tr className="border-b border-slate-800"><th className="text-left py-2 px-2">Pręt</th><th className="text-left py-2 px-2">Węzeł</th><th className="text-right py-2 px-2">V</th><th className="text-right py-2 px-2">Ms</th><th className="text-right py-2 px-2">Mz</th></tr></thead><tbody>
              {tableResults.elementForces.map((ef,i) => <Fragment key={i}>
                <tr className="border-b border-slate-800/30 hover:bg-slate-900/40">
                  <td className="py-1.5 px-2 text-cyan-400" rowSpan="2">{ef.el.id}</td>
                  <td className="py-1.5 px-2 text-slate-400">{ef.el.n1} (start)</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.V1, 'V')}</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.Ms1, 'M')}</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.Mz1, 'M')}</td>
                </tr>
                <tr className="border-b border-slate-800 hover:bg-slate-900/40">
                  <td className="py-1.5 px-2 text-slate-400">{ef.el.n2} (koniec)</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.V2, 'V')}</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.Ms2, 'M')}</td>
                  <td className="py-1.5 px-2 text-right">{symFmt(ef.Mz2, 'M')}</td>
                </tr>
              </Fragment>)}
            </tbody></table>}
            {tableResults && resultsTab==='reactions' && <table className="w-full text-sm font-mono"><thead className="text-[10px] uppercase text-slate-500 tracking-wider"><tr className="border-b border-slate-800"><th className="text-left py-2 px-2">Węzeł</th><th className="text-right py-2 px-2">Rz</th><th className="text-right py-2 px-2">Mx</th><th className="text-right py-2 px-2">My</th></tr></thead><tbody>
              {tableResults.reactions.filter(r => r.Fz!==null||r.Mx!==null||r.My!==null).map((r,i) => <tr key={i} className="border-b border-slate-800/50 hover:bg-slate-900/40">
                <td className="py-1.5 px-2 text-cyan-400">{r.id}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(r.Fz, 'Rz')}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(r.Mx, 'Rm')}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(r.My, 'Rm')}</td>
              </tr>)}
            </tbody></table>}
            {tableResults && resultsTab==='displacements' && <table className="w-full text-sm font-mono"><thead className="text-[10px] uppercase text-slate-500 tracking-wider"><tr className="border-b border-slate-800"><th className="text-left py-2 px-2">Węzeł</th><th className="text-right py-2 px-2">w</th><th className="text-right py-2 px-2">θx</th><th className="text-right py-2 px-2">θy</th></tr></thead><tbody>
              {tableResults.displacements.map((d,i) => <tr key={i} className="border-b border-slate-800/50 hover:bg-slate-900/40">
                <td className="py-1.5 px-2 text-cyan-400">{d.id}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(d.w, 'w', 4)}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(d.thetaX, 'th', 4)}</td>
                <td className="py-1.5 px-2 text-right">{symFmt(d.thetaY, 'th', 4)}</td>
              </tr>)}
            </tbody></table>}
            {!tableResults && <div className="text-sm text-slate-500 py-4">Stan {activeState} jest pusty (brak obciążeń ani q≠0). Dodaj dane lub przełącz stan.</div>}
          </div>
        </div>
      </div>}
    </div>
    {results && (
      <div className="hidden print:block bg-white text-slate-100">
        <PrintReport
          nodes={nodes} elements={elements} supports={supports}
          staticInfo={staticInfo}
          basicSystemOptions={basicSystemOptions} selectedOption={selectedOption}
          results={results} sym={sym} statesData={statesData} ejGcRatio={ejGcRatio}
        />
      </div>
    )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
